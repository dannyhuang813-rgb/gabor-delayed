<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>Gabor 分类实验</title>
  <style>
    :root {
      color-scheme: light dark;
    }
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }
    body, html {
      margin: 0;
      height: 100%;
      background: #888;
      color: #111;
    }
    #startScreen, #experimentContainer {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;
    }
    #experimentContainer {
      display: none;
    }
    #participantInput {
      padding: 10px 14px;
      font-size: 18px;
      border-radius: 6px;
      border: 1px solid #333;
      min-width: 260px;
    }
    #startButton {
      padding: 12px 24px;
      font-size: 18px;
      border-radius: 6px;
      border: none;
      background: #2c7be5;
      color: #fff;
      cursor: pointer;
    }
    #startButton:disabled {
      background: #777;
      cursor: not-allowed;
    }
    #canvasWrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: #888;
    }
    #feedbackOverlay {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: 48px;
      font-weight: bold;
      text-shadow: 0 0 10px rgba(0,0,0,0.5);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.1s ease;
    }
    #responseButtons {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 16px;
      z-index: 10;
    }
    #responseButtons button {
      padding: 14px 24px;
      font-size: 18px;
      border-radius: 999px;
      border: none;
      background: rgba(0,0,0,0.6);
      color: #fff;
      min-width: 140px;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    #responseButtons button:active {
      background: rgba(0,0,0,0.8);
    }
    #exitButton {
      position: fixed;
      top: 20px;
      left: 20px;
      padding: 10px 18px;
      font-size: 16px;
      border: none;
      border-radius: 999px;
      background: rgba(220, 53, 69, 0.9);
      color: #fff;
      cursor: pointer;
      z-index: 12;
      display: none;
    }
    #waitOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      color: #fff;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      z-index: 20;
    }
    #waitOverlay.visible {
      display: flex;
    }
    #waitOverlay .wait-box {
      background: rgba(0,0,0,0.55);
      padding: 28px 36px;
      border-radius: 16px;
      max-width: 520px;
      line-height: 1.5;
      font-size: 20px;
    }
    #waitOverlay button {
      margin-top: 18px;
      padding: 12px 32px;
      border: none;
      border-radius: 999px;
      font-size: 18px;
      background: #2c7be5;
      color: #fff;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="startScreen">
    <label for="participantInput">被试编号</label>
    <input id="participantInput" type="text" autocomplete="off" />
    <button id="startButton">开始</button>
    <p style="max-width: 420px; text-align: center; line-height: 1.4; font-size: 14px; color: #222;">
      点击“开始”进入 Gabor 分类实验。作答可按键 A/B，或点击屏幕下方的 A 类、B 类按钮。随时按下 Escape 可终止并立刻下载已收集数据。
    </p>
  </div>
  <div id="experimentContainer">
    <div id="canvasWrapper">
      <canvas id="gaborCanvas"></canvas>
      <div id="feedbackOverlay"></div>
    </div>
    <div id="responseButtons">
      <button class="responseButton" data-key="a">选择 A 类（键盘 A）</button>
      <button class="responseButton" data-key="b">选择 B 类（键盘 B）</button>
    </div>
  </div>
  <button id="exitButton">退出实验</button>
  <div id="waitOverlay">
    <div class="wait-box">
      <div id="waitOverlayText">请按任意键继续。</div>
      <button id="waitOverlayButton">点击继续</button>
    </div>
  </div>
  <script>
    // -------------------------
    // Configurable constants (do not mutate elsewhere)
    // -------------------------
    const N_RB = 200; // 5 blocks × 40 train trials
    const N_II = 200; // 5 blocks × 40 train trials per II structure

    const RB_GEN_COUNT = 40;
    const II_GEN_COUNT = 40;

    const USE_FIXATION = true,  FIX_MS = 500;
    const USE_PREBLANK = false, PREBLANK_MS = 0;
    const RESP_LIMIT_MS = 3000;
    const FEEDBACK_MS   = 500;

    // 固定物理范围：所有被试共用 sf=3~6、ori=±30°，便于按指令精确控制 sf×ori 的配对关系
    const FIXED_SF_RANGE = { min: 3, max: 6 };
    const FIXED_ORI_RANGE = { min: -30, max: 30 };
    const FIXED_SF_LEVELS = [3, 4, 5, 6];

    let activeSfRange = { ...FIXED_SF_RANGE };
    let activeOriRange = { ...FIXED_ORI_RANGE };
    let activeSfLevels = [...FIXED_SF_LEVELS];

    const ORI_JITTER = 0.5;

    let dynamicBinRanges = null;

    // 固定预生成的刺激池：每个被试都复用同一套 train/gen 列表
    let STIM_RB1_TRAIN = [];
    let STIM_RB2_TRAIN = [];
    let STIM_II1_TRAIN = [];
    let STIM_II2_TRAIN = [];
    let STIM_RB1_GEN = [];
    let STIM_RB2_GEN = [];
    let STIM_II1_GEN = [];
    let STIM_II2_GEN = [];

    function buildBinRangesFromOri(range) {
      const absMax = Math.abs(range.max);
      const step = absMax / 3;
      return {
        b1: { min: 0, max: step },
        b2: { min: step, max: step * 2 },
        b3: { min: step * 2, max: absMax }
      };
    }

    function recomputeDerivedPhysicalSettings() {
      const absMax = Math.abs(activeOriRange.max);
      dynamicBinRanges = buildBinRangesFromOri(activeOriRange);
    }

    function lockPhysicalRanges() {
      activeSfRange = { ...FIXED_SF_RANGE };
      activeOriRange = { ...FIXED_ORI_RANGE };
      activeSfLevels = [...FIXED_SF_LEVELS];
      recomputeDerivedPhysicalSettings();
    }

    lockPhysicalRanges();

    function getActiveSfLevels() {
      return activeSfLevels;
    }

    function getActiveRangeDescriptor() {
      return {
        sfRange: { ...activeSfRange },
        oriRange: { ...activeOriRange },
        sfLevels: [...activeSfLevels]
      };
    }

    let lastStimulusPlanMeta = { rangeChoice: getActiveRangeDescriptor(), heuristics: {} };

    const ORDER_CODE_PLANS = {
      '1': {
        session1: { movement: 'Seated', taskOrder: ['RB', 'II'] },
        session2: { movement: 'Walking', taskOrder: ['II', 'RB'] }
      },
      '2': {
        session1: { movement: 'Seated', taskOrder: ['II', 'RB'] },
        session2: { movement: 'Walking', taskOrder: ['RB', 'II'] }
      },
      '3': {
        session1: { movement: 'Walking', taskOrder: ['RB', 'II'] },
        session2: { movement: 'Seated', taskOrder: ['II', 'RB'] }
      },
      '4': {
        session1: { movement: 'Walking', taskOrder: ['II', 'RB'] },
        session2: { movement: 'Seated', taskOrder: ['RB', 'II'] }
      }
    };

    const II_STRUCTURES_LIBRARY = {
      II1: { key: 'II1' },
      II2: { key: 'II2' }
    };

    const II_STRUCTURE_PLANS = {
      1: [{ key: 'II1', blocks: 5 }],
      2: [{ key: 'II2', blocks: 5 }]
    };

    const II_SINGLE_DIM_MAX_ACCURACY = 0.70;
    const II_MAX_PLAN_ATTEMPTS = 500; // retry up to 500 times when building II pools before falling back

    const DELAYED_STAGE_MS = 2000;

    const II_BIN_KEYS = ['b1', 'b2', 'b3'];
    const II_LABELS = ['A', 'B'];

    // Session 1 的 II 配对：按照指令为每个 sf 分配特定的 ori 区间
    const CSV_HEADER = [
      'participant','group','orderCode','serial','sessionIndex','movement','task','iiStructure','orderInSession',
      'blockName','blockIndex','trialIndex','sf','ori','nearFlag','label','correctKey','resp','corr','rt','delayMs','trialStartUTC','qc_near_ratio','qc_counts_json'
    ];

    const LATENT_RANGE = { xMin: -2, xMax: 2, yMin: -2, yMax: 2 };
    const RB_BLOCK_COUNT = 5;
    const RB_TRIALS_PER_BLOCK = N_RB / RB_BLOCK_COUNT;
    const RB_GEN_BLOCK_INDEX = RB_BLOCK_COUNT + 1;
    const II_BLOCK_COUNT = 5;
    const II_TRIALS_PER_BLOCK = N_II / II_BLOCK_COUNT;
    const II_GEN_BLOCK_INDEX = II_BLOCK_COUNT + 1;

    const RB_RULES = {
      RB1: { threshold: 12, smallLabel: 'A' },
      RB2: { threshold: 12, smallLabel: 'B' }
    };

    const RB_GEN_SF_LEVELS = [3, 3.5, 4, 4.5, 5, 5.5, 6];
    const RB_GEN_MAG_LEVELS = [4, 8, 12, 16, 20, 24, 28];

    const II_QC_THRESHOLD = II_SINGLE_DIM_MAX_ACCURACY;
    const II_SF_LEVELS = [3, 4, 5, 6];
    const II_MAG_LEVELS = [5, 8, 11, 14, 17, 20, 23, 26];
    const II_GEN_SF_LEVELS = [3.0, 3.6, 4.2, 4.8, 5.4, 6.0];
    const II_GEN_MAG_LEVELS = [6, 10, 14, 18, 22, 26, 30];

    const II_RULES = {
      II1: { flip: 1 },
      II2: { flip: -1 }
    };

    // -------------------------
    // DOM references
    // -------------------------
    const startScreen = document.getElementById('startScreen');
    const experimentContainer = document.getElementById('experimentContainer');
    const startButton = document.getElementById('startButton');
    const participantInput = document.getElementById('participantInput');
    const canvas = document.getElementById('gaborCanvas');
    const ctx = canvas.getContext('2d');
    const feedbackOverlay = document.getElementById('feedbackOverlay');
    const responseButtons = document.querySelectorAll('.responseButton');
    const exitButton = document.getElementById('exitButton');
    const waitOverlay = document.getElementById('waitOverlay');
    const waitOverlayText = document.getElementById('waitOverlayText');
    const waitOverlayButton = document.getElementById('waitOverlayButton');

    // -------------------------
    // State variables
    // -------------------------
    let experimentRunning = false;
    let aborted = false;
    let participantId = '';
    let participantMeta = null;
    let sessionConfig = null;
    let dataRows = [];
    let responseState = null;
    let currentBlockName = '';
    let pendingDownload = false;
    let displayWidth = window.innerWidth;
    let displayHeight = window.innerHeight;
    let waitOverlayFinish = null;

    // -------------------------
    // Utility helpers
    // -------------------------
    function resizeCanvas() {
      const ratio = window.devicePixelRatio || 1;
      displayWidth = window.innerWidth;
      displayHeight = window.innerHeight;
      canvas.width = Math.round(displayWidth * ratio);
      canvas.height = Math.round(displayHeight * ratio);
      canvas.style.width = displayWidth + 'px';
      canvas.style.height = displayHeight + 'px';
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    }

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function wait(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function determineBinKey(ori) {
      if (!dynamicBinRanges) return null;
      const absMag = Math.abs(ori);
      if (absMag <= dynamicBinRanges.b1.max) return 'b1';
      if (absMag <= dynamicBinRanges.b2.max) return 'b2';
      if (absMag <= dynamicBinRanges.b3.max + 1e-6) return 'b3';
      return null;
    }

    function hashString(str) {
      let h = 1779033703 ^ str.length;
      for (let i = 0; i < str.length; i++) {
        h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
        h = (h << 13) | (h >>> 19);
      }
      return function rng() {
        h = Math.imul(h ^ (h >>> 16), 2246822507);
        h = Math.imul(h ^ (h >>> 13), 3266489909);
        h ^= h >>> 16;
        return (h >>> 0) / 4294967296;
      };
    }

    function shuffleInPlace(array, rng) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(rng() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }

    function shuffleBlockTrials(trials, seed) {
      const rngShuffle = hashString(`${seed}_shuffle`);
      const rngSwap = hashString(`${seed}_swap`);
      const shuffled = trials.map(trial => ({ ...trial }));
      shuffleInPlace(shuffled, rngShuffle);
      const tolerance = 0.01;
      const maxAttempts = Math.max(10, shuffled.length * 2);
      for (let attempt = 0; attempt < maxAttempts; attempt++) {
        let violationIndex = -1;
        for (let i = 0; i < shuffled.length - 1; i++) {
          const a = shuffled[i];
          const b = shuffled[i + 1];
          if (Math.sign(a.ori) !== Math.sign(b.ori) && Math.abs(Math.abs(a.ori) - Math.abs(b.ori)) < tolerance) {
            violationIndex = i;
            break;
          }
        }
        if (violationIndex === -1) break;
        let swapIdx = Math.floor(rngSwap() * shuffled.length);
        if (swapIdx === violationIndex || swapIdx === violationIndex + 1) {
          swapIdx = (swapIdx + 2) % shuffled.length;
        }
        [shuffled[violationIndex + 1], shuffled[swapIdx]] = [shuffled[swapIdx], shuffled[violationIndex + 1]];
      }
      shuffled.forEach((trial, idx) => {
        trial.trialIndex = idx + 1;
      });
      return shuffled;
    }

    function analyzeLabelRuns(trials) {
      let maxRun = 1;
      let currentRun = 1;
      for (let i = 1; i < trials.length; i++) {
        if (trials[i].label === trials[i - 1].label) {
          currentRun += 1;
        } else {
          if (currentRun > maxRun) maxRun = currentRun;
          currentRun = 1;
        }
      }
      if (currentRun > maxRun) maxRun = currentRun;
      return maxRun;
    }

    function shuffleIIBlockTrialsWithAntiStreak(trials, seed) {
      const maxAttempts = 400;
      let bestCandidate = null;
      let bestRun = Infinity;
      for (let attempt = 0; attempt < maxAttempts; attempt++) {
        const candidate = shuffleBlockTrials(trials, `${seed}_anti${attempt}`);
        const maxRun = analyzeLabelRuns(candidate);
        if (maxRun <= 4) {
          return candidate;
        }
        if (maxRun < bestRun) {
          bestRun = maxRun;
          bestCandidate = candidate;
        }
      }
      console.warn('II block ordering使用宽松防连串策略仍未满足≤4连串，回退到最佳序列', { seed, bestRun });
      return bestCandidate || shuffleBlockTrials(trials, `${seed}_fallback`);
    }

    function summarizeIIBlock(trials) {
      const summary = {
        total: trials.length,
        countA: 0,
        countB: 0,
        sfCounts: Object.fromEntries(getActiveSfLevels().map(level => [level, 0])),
        binCounts: { b1: 0, b2: 0, b3: 0 },
        nearCount: 0,
        nearA: 0,
        nearB: 0,
        farA: 0,
        farB: 0,
        nearSymbolic: 0
      };
      trials.forEach(trial => {
        if (trial.label === 'A') summary.countA += 1; else summary.countB += 1;
        if (summary.sfCounts[trial.sf] != null) summary.sfCounts[trial.sf] += 1;
        const binKey = trial.binKey || determineBinKey(trial.ori);
        if (binKey && summary.binCounts[binKey] != null) summary.binCounts[binKey] += 1;
        if (trial.nearFlag) {
          summary.nearCount += 1;
          if (trial.label === 'A') summary.nearA += 1; else summary.nearB += 1;
          if (trial.symbolicFlag) summary.nearSymbolic += 1;
        } else {
          if (trial.label === 'A') summary.farA += 1; else summary.farB += 1;
        }
      });
      summary.nearRatio = summary.total ? summary.nearCount / summary.total : 0;
      summary.nearSymbolicRatio = summary.nearCount ? summary.nearSymbolic / summary.nearCount : 0;
      return summary;
    }

    // -------------------------
    // Participant driven configuration
    // -------------------------
    function parseIdV2(id, sessionIndex) {
      const trimmed = (id || '').trim().toUpperCase();
      const match = trimmed.match(/^([AB])([1-4])(\d+)$/);
      if (!match) {
        return null;
      }
      if (sessionIndex !== 1 && sessionIndex !== 2) {
        return null;
      }
      const group = match[1];
      const orderCode = match[2];
      const serial = match[3];
      const plan = ORDER_CODE_PLANS[orderCode];
      if (!plan) {
        return null;
      }
      const sessionPlan = sessionIndex === 1 ? plan.session1 : plan.session2;
      if (!sessionPlan) {
        return null;
      }
      const delayMs = group === 'B' ? DELAYED_STAGE_MS : 0;
      return {
        group,
        orderCode,
        serial,
        sessionIndex,
        movement: sessionPlan.movement,
        taskOrder: [...sessionPlan.taskOrder],
        delayMs
      };
    }

    function requestSessionIndex() {
      while (true) {
        const response = window.prompt('本次是第几次进行实验？请选择 1 或 2');
        if (response === null) {
          return null;
        }
        const trimmed = response.trim();
        if (trimmed === '1' || trimmed === '2') {
          return Number(trimmed);
        }
        alert('请输入数字 1 或 2。');
      }
    }

    function sessionParams(sessionIndex) {
      const planTemplate = II_STRUCTURE_PLANS[sessionIndex];
      if (!planTemplate) {
        console.error(`未为 session ${sessionIndex} 定义 II 计划模板`);
        return { rbRule: sessionIndex === 2 ? 'RB2' : 'RB1', iiPlan: [] };
      }
      const iiPlan = planTemplate.map(item => ({ ...item }));
      return { rbRule: sessionIndex === 2 ? 'RB2' : 'RB1', iiPlan };
    }

    // -------------------------
    // Labeling functions
    // -------------------------
    function labelRB(sfLines, oriDeg, rbRule) {
      const rule = RB_RULES[rbRule] || RB_RULES.RB1;
      const smallLabel = rule.smallLabel;
      return Math.abs(oriDeg) < rule.threshold ? smallLabel : (smallLabel === 'A' ? 'B' : 'A');
    }

    function computeIIProjection(sfLines, oriDeg, structure) {
      const key = structure?.key || 'II1';
      const s = sfLines - 4.5;
      const o = Math.abs(oriDeg) - 10;
      const flip = II_RULES[key]?.flip || 1;
      const raw = s * o * flip;
      return { x: s, y: o, raw, norm: 1 };
    }

    function labelII(sfLines, oriDeg, structure) {
      const proj = computeIIProjection(sfLines, oriDeg, structure);
      return proj.raw >= 0 ? 'A' : 'B';
    }

    // -------------------------
    // Stimulus generation helpers
    // -------------------------
    function buildSfSchedule(total, seed) {
      const levels = getActiveSfLevels();
      const perLevel = Math.floor(total / levels.length);
      let remainder = total - perLevel * levels.length;
      const schedule = [];
      for (const sf of levels) {
        const count = perLevel + (remainder > 0 ? 1 : 0);
        if (remainder > 0) remainder--;
        for (let i = 0; i < count; i++) {
          schedule.push(sf);
        }
      }
      shuffleInPlace(schedule, hashString(`${seed}_sfSchedule`));
      return schedule;
    }

    function buildSfScheduleForSet(total, allowedSfs, seed) {
      const perLevel = Math.floor(total / allowedSfs.length);
      let remainder = total - perLevel * allowedSfs.length;
      const schedule = [];
      for (const sf of allowedSfs) {
        const count = perLevel + (remainder > 0 ? 1 : 0);
        if (remainder > 0) remainder--;
        for (let i = 0; i < count; i++) {
          schedule.push(sf);
        }
      }
      shuffleInPlace(schedule, hashString(`${seed}_subsetSf`));
      return schedule;
    }

    function buildSymmetricOrientationList(minMag, maxMag, includeZero, total, seed) {
      const cycle = [];
      if (includeZero && minMag === 0) {
        cycle.push(0);
      }
      const startMag = Math.max(1, minMag);
      if (startMag > maxMag && !(includeZero && minMag === 0)) {
        return [];
      }
      for (let mag = startMag; mag <= maxMag; mag++) {
        cycle.push(-mag, mag);
      }
      if (cycle.length === 0) {
        return [];
      }
      const result = [];
      const baseCycles = Math.floor(total / cycle.length);
      for (let i = 0; i < baseCycles; i++) {
        const copy = [...cycle];
        shuffleInPlace(copy, hashString(`${seed}_cycle_${i}`));
        result.push(...copy);
      }
      let remaining = total - baseCycles * cycle.length;
      if (includeZero && minMag === 0 && remaining > 0) {
        result.push(0);
        remaining -= 1;
      }
      if (includeZero && minMag === 0 && remaining % 2 === 1) {
        result.push(0);
        remaining -= 1;
      }
      let mag = startMag;
      while (remaining > 0) {
        if (mag > maxMag) {
          mag = startMag;
        }
        if (remaining >= 2) {
          result.push(-mag, mag);
          remaining -= 2;
          mag += 1;
        } else {
          break;
        }
      }
      return result.slice(0, total);
    }

    function symmetricPairMagnitudes(start, end, pairCount) {
      const mags = [];
      let mag = start;
      for (let i = 0; i < pairCount; i++) {
        mags.push(mag);
        mag += 1;
        if (mag > end) mag = start;
      }
      return mags;
    }

    function buildRBBin(magStart, magEnd, count, seed, binKey, jitterMax = 0.4) {
      const pairCount = count / 2;
      const mags = symmetricPairMagnitudes(magStart, magEnd, pairCount);
      const rng = hashString(seed);
      const orientations = [];
      mags.forEach((mag, idx) => {
        const jitter = (rng() * 2 - 1) * jitterMax;
        const magWithJitter = clamp(mag + jitter, activeOriRange.min, activeOriRange.max);
        orientations.push({ ori: magWithJitter, binKey }, { ori: -magWithJitter, binKey });
      });
      shuffleInPlace(orientations, hashString(`${seed}_shuffle`));
      return orientations;
    }


    function getIIStructureConfig(key) {
      return II_STRUCTURES_LIBRARY[key] || null;
    }

    function formatIIStructureFormula(structure) {
      if (!structure?.boundary) return '';
      const { w1, w2, c } = structure.boundary;
      return `${structure.key}: score = ${w1.toFixed(2)} * x + ${w2.toFixed(2)} * y + ${c.toFixed(2)} (x,y 为潜在空间坐标)`;
    }

    function linearMap(value, inMin, inMax, outMin, outMax) {
      const ratio = (value - inMin) / (inMax - inMin);
      return outMin + ratio * (outMax - outMin);
    }

    function sampleStandardNormal(rng) {
      const u1 = Math.max(rng(), Number.EPSILON);
      const u2 = rng();
      return Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
    }

    function cholesky2x2(matrix) {
      const a = matrix[0][0];
      const b = matrix[0][1];
      const c = matrix[1][1];
      const l11 = Math.sqrt(Math.max(a, 1e-6));
      const l21 = b / l11;
      const l22 = Math.sqrt(Math.max(c - l21 * l21, 1e-6));
      return [
        [l11, 0],
        [l21, l22]
      ];
    }

    function invert2x2(matrix) {
      const [[a, b], [c, d]] = matrix;
      const det = a * d - b * c;
      if (Math.abs(det) < 1e-6) {
        return [
          [1 / Math.max(a, 1e-3), 0],
          [0, 1 / Math.max(d, 1e-3)]
        ];
      }
      const invDet = 1 / det;
      return [
        [d * invDet, -b * invDet],
        [-c * invDet, a * invDet]
      ];
    }

    function computeBayesBoundaryFromGaussians(classA, classB) {
      const inv = invert2x2(classA.cov);
      const diff = [classA.mean[0] - classB.mean[0], classA.mean[1] - classB.mean[1]];
      const w1 = inv[0][0] * diff[0] + inv[0][1] * diff[1];
      const w2 = inv[1][0] * diff[0] + inv[1][1] * diff[1];
      const projA = classA.mean[0] * w1 + classA.mean[1] * w2;
      const projB = classB.mean[0] * w1 + classB.mean[1] * w2;
      const bias = 0.5 * (projB - projA);
      const norm = Math.sqrt(w1 * w1 + w2 * w2) || 1;
      return { w1, w2, c: bias, norm };
    }

    function bayesDecision(latentX, latentY, boundary) {
      if (!boundary) return 'A';
      return (boundary.w1 * latentX + boundary.w2 * latentY + boundary.c) >= 0 ? 'A' : 'B';
    }

    function sampleBivariateNormal(mean, cov, rng) {
      const z0 = sampleStandardNormal(rng);
      const z1 = sampleStandardNormal(rng);
      const L = cholesky2x2(cov);
      const x = mean[0] + L[0][0] * z0;
      const y = mean[1] + L[1][0] * z0 + L[1][1] * z1;
      return [x, y];
    }

    function sampleLatentPoint(params, rng) {
      const maxAttempts = 400;
      for (let attempt = 0; attempt < maxAttempts; attempt++) {
        const point = sampleBivariateNormal(params.mean, params.cov, rng);
        if (point[0] < LATENT_RANGE.xMin || point[0] > LATENT_RANGE.xMax) continue;
        if (point[1] < LATENT_RANGE.yMin || point[1] > LATENT_RANGE.yMax) continue;
        return point;
      }
      return null;
    }

    const ORI_MAG_MIN = 3;

    // x in normal space → 线性映射到 [3,6] → 量化为 {3,4,5,6}
    function mapLatentToPhysicalSf(latentX) {
      return clamp(
        linearMap(latentX, LATENT_RANGE.xMin, LATENT_RANGE.xMax, activeSfRange.min, activeSfRange.max),
        activeSfRange.min,
        activeSfRange.max
      );
    }

    // y in normal space → |ori| ∈ [3°, 30°]，方向符号稍后随机决定
    function mapLatentToPhysicalOriMagnitude(latentY) {
      const absLatent = Math.abs(latentY);
      return clamp(
        linearMap(absLatent, LATENT_RANGE.yMin, LATENT_RANGE.yMax, ORI_MAG_MIN, Math.abs(activeOriRange.max)),
        ORI_MAG_MIN,
        Math.abs(activeOriRange.max)
      );
    }

    function mapLatentToPhysical(x, y) {
      return {
        sf: mapLatentToPhysicalSf(x),
        ori: clamp(
          linearMap(y, LATENT_RANGE.yMin, LATENT_RANGE.yMax, activeOriRange.min, activeOriRange.max),
          activeOriRange.min,
          activeOriRange.max
        )
      };
    }

    function mapPhysicalSfToLatent(sfValue) {
      return clamp(
        linearMap(sfValue, activeSfRange.min, activeSfRange.max, LATENT_RANGE.xMin, LATENT_RANGE.xMax),
        LATENT_RANGE.xMin,
        LATENT_RANGE.xMax
      );
    }

    function mapPhysicalOriToLatent(oriValue) {
      const absOri = Math.abs(oriValue);
      return clamp(
        linearMap(absOri, 0, Math.abs(activeOriRange.max), LATENT_RANGE.yMin, LATENT_RANGE.yMax),
        LATENT_RANGE.yMin,
        LATENT_RANGE.yMax
      );
    }

    function quantizeSfLines(value) {
      const levels = getActiveSfLevels();
      let best = levels[0];
      let bestDiff = Infinity;
      levels.forEach(target => {
        const diff = Math.abs(value - target);
        if (diff < bestDiff) {
          bestDiff = diff;
          best = target;
        }
      });
      return best;
    }

    function sampleStimulusFromGaussian(classCfg, rng) {
      const latent = sampleLatentPoint(classCfg, rng);
      if (!latent) return null;
      const sfValue = quantizeSfLines(mapLatentToPhysicalSf(latent[0]));
      const oriMag = mapLatentToPhysicalOriMagnitude(latent[1]);
      const sign = rng() < 0.5 ? -1 : 1;
      const oriValue = Number((sign * oriMag).toFixed(3));
      return { sf: sfValue, ori: oriValue, latentX: latent[0], latentY: latent[1] };
    }

    function deterministicShuffle(list, seed) {
      const copy = list.map(item => ({ ...item }));
      shuffleInPlace(copy, hashString(seed));
      return copy;
    }

    function computeIIDistance(latentX, latentY, boundary) {
      if (!boundary) return { score: 0, distance: 0 };
      const absY = Math.abs(latentY);
      const score = boundary.w1 * latentX + boundary.w2 * absY + boundary.c;
      const distance = Math.abs(score) / (boundary.norm || 1);
      return { score, distance };
    }

    function buildTrialFromStimulus(base, extras = {}) {
      return {
        sf: base.sf,
        ori: Number(Number(base.ori).toFixed(3)),
        label: base.label,
        catType: extras.catType || '',
        phase: extras.phase || 'train',
        iiStructure: extras.iiStructure || '',
        nearFlag: extras.nearFlag || 0,
        symbolicFlag: extras.symbolicFlag || 0
      };
    }

    function cloneBlocks(blocks) {
      return blocks.map(block => block.map(trial => ({ ...trial })));
    }

    function cloneBlockSet(blockSet) {
      return {
        train: cloneBlocks((blockSet && blockSet.train) || []),
        gen: cloneBlocks((blockSet && blockSet.gen) || [])
      };
    }

    function ensureTrialCount(trials, desiredTotal) {
      if (trials.length >= desiredTotal) return;
      if (!trials.length) throw new Error('无法补齐试次数：trial 列表为空');
      const deficit = desiredTotal - trials.length;
      for (let i = 0; i < deficit; i++) {
        const template = trials[i % trials.length];
        trials.push({ ...template });
      }
    }

    function distributeCounts(total, slots) {
      const counts = [];
      const base = Math.floor(total / slots);
      let remainder = total - base * slots;
      for (let i = 0; i < slots; i++) {
        const extra = remainder > 0 ? 1 : 0;
        counts.push(base + extra);
        if (remainder > 0) remainder--;
      }
      return counts;
    }

    function sampleOrientationFromRange(range, rng) {
      const min = Math.min(range[0], range[1]);
      const max = Math.max(range[0], range[1]);
      const value = min + rng() * (max - min);
      return Number(value.toFixed(3));
    }

    function gaussianRandom(rng) {
      let u = 0;
      let v = 0;
      while (u === 0) u = rng();
      while (v === 0) v = rng();
      return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
    }

    function buildRBPool(ruleKey, phase, totalCount, seed) {
      const rule = RB_RULES[ruleKey];
      const rng = hashString(`${ruleKey}_${phase}_${seed}`);
      const trials = [];
      const perLabel = Math.floor(totalCount / 2);
      const sfLevels = getActiveSfLevels();
      const pickSf = () => sfLevels[Math.floor(rng() * sfLevels.length)];
      const absMax = Math.abs(activeOriRange.max);
      const margin = 1.5;
      const nearRange = [3, Math.max(5, rule.threshold - margin)];
      const farRange = [Math.min(rule.threshold + margin, absMax - 1), absMax];
      const smallLabel = rule.smallLabel;
      const largeLabel = smallLabel === 'A' ? 'B' : 'A';

      const emitTrial = (label, range) => {
        const mag = sampleOrientationFromRange(range, rng);
        const sign = rng() < 0.5 ? -1 : 1;
        const ori = Number((sign * mag).toFixed(3));
        return buildTrialFromStimulus(
          { sf: pickSf(), ori, label },
          { catType: ruleKey, phase, nearFlag: 0 }
        );
      };

      for (let i = 0; i < perLabel; i++) {
        trials.push(emitTrial(smallLabel, nearRange));
        trials.push(emitTrial(largeLabel, farRange));
      }
      ensureTrialCount(trials, totalCount);
      return deterministicShuffle(trials, `${ruleKey}_${phase}_shuffle`);
    }

    function buildRBGeneralization(ruleKey, seed) {
      const rule = RB_RULES[ruleKey];
      const combos = [];
      RB_GEN_SF_LEVELS.forEach(sf => {
        RB_GEN_MAG_LEVELS.forEach(mag => combos.push({ sf, mag }));
      });
      const shuffled = deterministicShuffle(combos, `${ruleKey}_genGrid_${seed}`);
      const rng = hashString(`${ruleKey}_genSign_${seed}`);
      const trials = [];
      for (let i = 0; i < RB_GEN_COUNT; i++) {
        const combo = shuffled[i % shuffled.length];
        const labelSmall = rule.smallLabel;
        const label = combo.mag < rule.threshold ? labelSmall : (labelSmall === 'A' ? 'B' : 'A');
        const sign = rng() < 0.5 ? -1 : 1;
        trials.push(buildTrialFromStimulus(
          { sf: Number(combo.sf.toFixed(3)), ori: Number((sign * combo.mag).toFixed(3)), label },
          { catType: ruleKey, phase: 'gen', nearFlag: 0 }
        ));
      }
      return trials;
    }

    function generateRBStimulusSet(catType, seed) {
      const train = buildRBPool(catType, 'train', N_RB, seed);
      const gen = buildRBGeneralization(catType, seed);
      return { train, gen };
    }

    // 非线性乘积规则：d = (sf-4.5) * (|ori|-10)。II1 取 d>=0→A，II2 翻转标签。
    function assignIILabel(sfValue, oriMag, ruleKey) {
      const s = sfValue - 4.5;
      const o = oriMag - 10;
      const d = s * o * (II_RULES[ruleKey]?.flip || 1);
      return d >= 0 ? 'A' : 'B';
    }

    function buildIICandidate(ruleKey, totalCount, seed) {
      const rng = hashString(`${ruleKey}_candidate_${seed}`);
      const sfLevels = [...II_SF_LEVELS];
      const perLabelPerSf = Math.floor(totalCount / (sfLevels.length * II_LABELS.length));
      const trials = [];

      const combosBySf = new Map();
      sfLevels.forEach(sf => {
        const labelMap = { A: [], B: [] };
        II_MAG_LEVELS.forEach(mag => {
          const label = assignIILabel(sf, mag, ruleKey);
          labelMap[label].push({ sf, mag });
        });
        combosBySf.set(sf, labelMap);
      });

      const emitStimulus = (sf, mag, label) => {
        const sfValue = Number(sf.toFixed(3));
        const jitteredMag = clamp(mag + gaussianRandom(rng) * 1.0, 3, Math.abs(activeOriRange.max));
        const sign = rng() < 0.5 ? -1 : 1;
        const ori = Number((sign * jitteredMag).toFixed(3));
        trials.push(buildTrialFromStimulus(
          { sf: sfValue, ori, label },
          { catType: ruleKey, phase: 'train', iiStructure: ruleKey, nearFlag: 0 }
        ));
      };

      sfLevels.forEach(sf => {
        const labelMap = combosBySf.get(sf);
        II_LABELS.forEach(label => {
          const combos = labelMap[label].length ? labelMap[label] : II_MAG_LEVELS.map(mag => ({ sf, mag }));
          for (let i = 0; i < perLabelPerSf; i++) {
            const pick = combos[Math.floor(rng() * combos.length)];
            emitStimulus(pick.sf, pick.mag, label);
          }
        });
      });

      ensureTrialCount(trials, totalCount);
      return deterministicShuffle(trials, `${ruleKey}_train_shuffle_${seed}`);
    }

    function buildIIGeneralization(ruleKey, totalCount, seed) {
      const combos = [];
      II_GEN_SF_LEVELS.forEach(sf => {
        II_GEN_MAG_LEVELS.forEach(mag => combos.push({ sf, mag }));
      });
      const shuffled = deterministicShuffle(combos, `${ruleKey}_gen_${seed}`);
      const rng = hashString(`${ruleKey}_genPhase_${seed}`);
      const trials = [];
      for (let i = 0; i < totalCount; i++) {
        const combo = shuffled[i % shuffled.length];
        const label = assignIILabel(combo.sf, combo.mag, ruleKey);
        const sign = rng() < 0.5 ? -1 : 1;
        trials.push(buildTrialFromStimulus(
          { sf: Number(combo.sf.toFixed(3)), ori: Number((sign * combo.mag).toFixed(3)), label },
          { catType: ruleKey, phase: 'gen', iiStructure: ruleKey, nearFlag: 0 }
        ));
      }
      return trials;
    }

    function qcSingleDimensionForII(trials) {
      if (!trials.length) {
        return { maxSfAcc: 0, maxAbsOriAcc: 0, singleAccuracy: 0 };
      }
      const sfVals = trials.map(t => t.sf);
      const absOriVals = trials.map(t => Math.abs(t.ori));
      const labels = trials.map(t => t.label);
      const maxSfAcc = best1DAcc(sfVals, labels);
      const maxAbsOriAcc = best1DAcc(absOriVals, labels);
      return { maxSfAcc, maxAbsOriAcc, singleAccuracy: Math.max(maxSfAcc, maxAbsOriAcc) };
    }

    function best1DAcc(values, labels) {
      if (!values.length) return 0;
      const paired = values.map((value, idx) => ({ value, label: labels[idx] }));
      paired.sort((a, b) => a.value - b.value);
      const thresholds = [];
      for (let i = 0; i < paired.length - 1; i++) {
        const mid = (paired[i].value + paired[i + 1].value) / 2;
        thresholds.push(mid);
      }
      const minValue = paired[0].value - 0.001;
      const maxValue = paired[paired.length - 1].value + 0.001;
      thresholds.push(minValue, maxValue);
      let best = 0;
      thresholds.forEach(th => {
        let correctA = 0;
        let correctB = 0;
        for (let i = 0; i < paired.length; i++) {
          const predictedA = paired[i].value <= th ? 'A' : 'B';
          if (predictedA === paired[i].label) correctA += 1;
          const predictedB = paired[i].value <= th ? 'B' : 'A';
          if (predictedB === paired[i].label) correctB += 1;
        }
        best = Math.max(best, correctA / paired.length, correctB / paired.length);
      });
      return best;
    }

    function nearestSfLevel(value, levels = II_SF_LEVELS) {
      let best = levels[0];
      let bestDiff = Math.abs(value - best);
      for (let i = 1; i < levels.length; i++) {
        const diff = Math.abs(value - levels[i]);
        if (diff < bestDiff) {
          best = levels[i];
          bestDiff = diff;
        }
      }
      return Number(best.toFixed(3));
    }

    function evaluateSfBinBalance(trials) {
      const sfStats = new Map();
      const bucketKeys = dynamicBinRanges ? Object.keys(dynamicBinRanges) : [];
      const bucketStats = {};
      bucketKeys.forEach(key => {
        bucketStats[key] = { A: 0, B: 0 };
      });
      trials.forEach(trial => {
        const sfKey = nearestSfLevel(trial.sf);
        if (!sfStats.has(sfKey)) {
          sfStats.set(sfKey, { A: 0, B: 0 });
        }
        sfStats.get(sfKey)[trial.label] += 1;
        const binKey = determineBinKey(trial.ori);
        if (binKey && bucketStats[binKey]) {
          bucketStats[binKey][trial.label] += 1;
        }
      });
      let sfOk = true;
      sfStats.forEach(stats => {
        if (stats.A !== stats.B) {
          sfOk = false;
        }
      });
      let binOk = true;
      Object.keys(bucketStats).forEach(key => {
        const stats = bucketStats[key];
        const total = stats.A + stats.B;
        if (total === 0) {
          binOk = false;
        } else {
          const ratio = stats.A / total;
          if (ratio < 0.4 || ratio > 0.6) {
            binOk = false;
          }
        }
      });
      return {
        sfOk,
        binOk,
        sfStats: Object.fromEntries(sfStats),
        bucketStats
      };
    }

    function generateIIStimulusSet(catType, seed) {
      let bestTrain = null;
      let bestMeta = null;
      let bestScore = Infinity;
      for (let attempt = 0; attempt < II_MAX_PLAN_ATTEMPTS; attempt++) {
        const train = buildIICandidate(catType, N_II, `${seed}_${attempt}`);
        const heuristics = qcSingleDimensionForII(train);
        const balance = evaluateSfBinBalance(train);
        const worst = Math.max(heuristics.maxSfAcc, heuristics.maxAbsOriAcc);
        const passed = worst <= II_QC_THRESHOLD && balance.sfOk && balance.binOk;
        const compositeScore = passed ? worst : Math.max(worst, balance.sfOk ? 0 : 1, balance.binOk ? 0 : 1);
        if (passed) {
          const gen = buildIIGeneralization(catType, II_GEN_COUNT, `${seed}_${attempt}`);
          return { train, gen, heuristics: { ...heuristics, balance } };
        }
        if (compositeScore < bestScore) {
          bestScore = compositeScore;
          bestTrain = train;
          bestMeta = { heuristics, balance };
        }
      }
      console.warn(
        `II ${catType}: 未在 ${II_MAX_PLAN_ATTEMPTS} 次内满足单维/分桶约束，使用最佳候选`,
        bestMeta
      );
      const fallbackGen = buildIIGeneralization(catType, II_GEN_COUNT, `${catType}_fallback`);
      const heuristics = bestMeta?.heuristics || { maxSfAcc: 1, maxAbsOriAcc: 1 };
      const balance = bestMeta?.balance || { sfOk: false, binOk: false };
      return { train: bestTrain || [], gen: fallbackGen, heuristics: { ...heuristics, balance } };
    }

    function chunkStimuliForBlocks(stimuli, blockSize, prefix, seedPrefix) {
      const blockCount = Math.floor(stimuli.length / blockSize);
      const halfBlock = blockSize / 2;
      const labelBuckets = { A: [], B: [] };
      stimuli.forEach(trial => {
        if (labelBuckets[trial.label]) {
          labelBuckets[trial.label].push({ ...trial });
        }
      });
      const requiredPerLabel = blockCount * halfBlock;
      if (!Number.isInteger(halfBlock)) {
        throw new Error('blockSize 必须是偶数，以便每个 block A/B 均衡');
      }
      if (labelBuckets.A.length < requiredPerLabel || labelBuckets.B.length < requiredPerLabel) {
        throw new Error('刺激池中 A/B 数量不足，无法保证每个 block 1:1');
      }
      const queueA = deterministicShuffle(labelBuckets.A, `${seedPrefix}_${prefix}_A`).slice(0, requiredPerLabel);
      const queueB = deterministicShuffle(labelBuckets.B, `${seedPrefix}_${prefix}_B`).slice(0, requiredPerLabel);
      let offsetA = 0;
      let offsetB = 0;
      const blocks = [];
      for (let i = 0; i < blockCount; i++) {
        const chunkA = queueA.slice(offsetA, offsetA + halfBlock);
        const chunkB = queueB.slice(offsetB, offsetB + halfBlock);
        offsetA += halfBlock;
        offsetB += halfBlock;
        const merged = chunkA.concat(chunkB).map(trial => ({
          ...trial,
          blockName: `${prefix}-${i + 1}`,
          blockIndex: i + 1
        }));
        const ordered = prefix === 'II'
          ? shuffleIIBlockTrialsWithAntiStreak(merged, `${seedPrefix}_${prefix}_blk${i}`)
          : shuffleBlockTrials(merged, `${seedPrefix}_${prefix}_blk${i}`);
        ordered.forEach((trial, idx) => {
          trial.correctKey = trial.label === 'A' ? 'a' : 'b';
          trial.binKey = determineBinKey(trial.ori);
          trial.trialIndex = idx + 1;
        });
        blocks.push(ordered);
      }
      return blocks;
    }

    function wrapGeneralizationBlocks(stimuli, blockLabel, seedPrefix, blockIndexValue) {
      if (!stimuli || !stimuli.length) return [];
      const shuffled = deterministicShuffle(stimuli, `${seedPrefix}_${blockLabel}_genwrap`);
      const block = shuffled.map((trial, idx) => ({
        ...trial,
        blockName: blockLabel,
        blockIndex: blockIndexValue,
        trialIndex: idx + 1,
        correctKey: trial.label === 'A' ? 'a' : 'b',
        binKey: determineBinKey(trial.ori)
      }));
      return [block];
    }

    function precomputeFixedStimuli() {
      lockPhysicalRanges();

      const rb1 = generateRBStimulusSet('RB1', 'RB1');
      const rb2 = generateRBStimulusSet('RB2', 'RB2');
      STIM_RB1_TRAIN = rb1.train;
      STIM_RB1_GEN = rb1.gen;
      STIM_RB2_TRAIN = rb2.train;
      STIM_RB2_GEN = rb2.gen;

      const ii1 = generateIIStimulusSet('II1', 'II1');
      const ii2 = generateIIStimulusSet('II2', 'II2');
      STIM_II1_TRAIN = ii1.train;
      STIM_II1_GEN = ii1.gen;
      STIM_II2_TRAIN = ii2.train;
      STIM_II2_GEN = ii2.gen;

      const rb1TrainBlocks = chunkStimuliForBlocks(STIM_RB1_TRAIN, RB_TRIALS_PER_BLOCK, 'RB', 'RB1');
      const rb2TrainBlocks = chunkStimuliForBlocks(STIM_RB2_TRAIN, RB_TRIALS_PER_BLOCK, 'RB', 'RB2');
      const ii1TrainBlocks = chunkStimuliForBlocks(STIM_II1_TRAIN, II_TRIALS_PER_BLOCK, 'II', 'II1');
      const ii2TrainBlocks = chunkStimuliForBlocks(STIM_II2_TRAIN, II_TRIALS_PER_BLOCK, 'II', 'II2');
      const rb1GenBlocks = wrapGeneralizationBlocks(STIM_RB1_GEN, 'RB-GEN', 'RB1', RB_GEN_BLOCK_INDEX);
      const rb2GenBlocks = wrapGeneralizationBlocks(STIM_RB2_GEN, 'RB-GEN', 'RB2', RB_GEN_BLOCK_INDEX);
      const ii1GenBlocks = wrapGeneralizationBlocks(STIM_II1_GEN, 'II-GEN', 'II1', II_GEN_BLOCK_INDEX);
      const ii2GenBlocks = wrapGeneralizationBlocks(STIM_II2_GEN, 'II-GEN', 'II2', II_GEN_BLOCK_INDEX);

      const store = {
        1: {
          RB: { train: rb1TrainBlocks, gen: rb1GenBlocks },
          II: { train: ii1TrainBlocks, gen: ii1GenBlocks }
        },
        2: {
          RB: { train: rb2TrainBlocks, gen: rb2GenBlocks },
          II: { train: ii2TrainBlocks, gen: ii2GenBlocks }
        }
      };

      const heuristics = {
        1: ii1.heuristics || {},
        2: ii2.heuristics || {}
      };
      lastStimulusPlanMeta = { rangeChoice: getActiveRangeDescriptor(), heuristics };
      console.log('预生成固定刺激集：', {
        range: lastStimulusPlanMeta.rangeChoice,
        heuristics,
        rbTrain: { RB1: STIM_RB1_TRAIN.length, RB2: STIM_RB2_TRAIN.length },
        iiTrain: { II1: STIM_II1_TRAIN.length, II2: STIM_II2_TRAIN.length }
      });

      if (
        !store[1].RB.train.length ||
        !store[1].II.train.length ||
        !store[2].RB.train.length ||
        !store[2].II.train.length
      ) {
        console.error('警告：某些 session 的刺激块为空，请检查高斯参数或采样阈值设置。');
      }

      return store;
    }

    // experimentInit 之前执行一次，生成全局固定刺激池
    const PRECOMPUTED_GAUSSIAN_STIMULI = precomputeFixedStimuli();

    function makeTrialsRB_balancedV3(participantId, rbRule) {
      const sessionIndex = rbRule === 'RB2' ? 2 : 1;
      const blockSet = PRECOMPUTED_GAUSSIAN_STIMULI[sessionIndex]?.RB || { train: [], gen: [] };
      return cloneBlockSet(blockSet);
    }

    function evaluateSingleDimHeuristics(trials) {
      return qcSingleDimensionForII(trials);
    }

    function makeTrialsII_balancedV3(participantId, plan) {
      if (!Array.isArray(plan) || !plan.length) {
        return { train: [], gen: [] };
      }
      const key = plan[0]?.key;
      const sessionIndex = key === 'II1' ? 1 : 2;
      const blockSet = PRECOMPUTED_GAUSSIAN_STIMULI[sessionIndex]?.II || { train: [], gen: [] };
      return cloneBlockSet(blockSet);
    }
    // -------------------------
    // Stimulus rendering
    // -------------------------
    function drawBackground() {
      ctx.fillStyle = '#888';
      ctx.fillRect(0, 0, displayWidth, displayHeight);
    }

    function drawFixation() {
      drawBackground();
      const centerX = displayWidth / 2;
      const centerY = displayHeight / 2;
      ctx.strokeStyle = '#111';
      const ratio = window.devicePixelRatio || 1;
      ctx.lineWidth = 4 / ratio;
      const size = Math.min(displayWidth, displayHeight) * 0.02;
      ctx.beginPath();
      ctx.moveTo(centerX - size, centerY);
      ctx.lineTo(centerX + size, centerY);
      ctx.moveTo(centerX, centerY - size);
      ctx.lineTo(centerX, centerY + size);
      ctx.stroke();
    }

    function drawBlank() {
      drawBackground();
    }

    function drawGabor(ctx, cx, cy, diameterPx, oriDeg, sfPairs) {
      const size = Math.max(8, Math.round(diameterPx));
      const offCanvas = document.createElement('canvas');
      offCanvas.width = size;
      offCanvas.height = size;
      const offCtx = offCanvas.getContext('2d');
      const imageData = offCtx.createImageData(size, size);
      const data = imageData.data;
      const radius = size / 2;
      const orientation = oriDeg * Math.PI / 180;
      // 条纹换算：sfPairs 表示黑白为一组的可见条纹数量（cycle 数），freq=cycle/D 确保直径方向出现指定组数。
      const cycles = sfPairs;
      const freq = cycles / size;
      const cosOri = Math.cos(orientation);
      const sinOri = Math.sin(orientation);
      const sigma = radius * 0.45;
      const twoSigmaSq = 2 * sigma * sigma;
      const base = 128;
      const amplitude = 110;
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const dx = x - radius + 0.5;
          const dy = y - radius + 0.5;
          const distSq = dx * dx + dy * dy;
          const idx = (y * size + x) * 4;
          if (distSq > radius * radius) {
            data[idx] = 136;
            data[idx + 1] = 136;
            data[idx + 2] = 136;
            data[idx + 3] = 255;
            continue;
          }
          const rotX = dx * cosOri + dy * sinOri;
          const sine = Math.cos(2 * Math.PI * freq * rotX);
          const gaussian = Math.exp(-distSq / twoSigmaSq);
          const value = clamp(Math.round(base + gaussian * amplitude * sine), 0, 255);
          data[idx] = value;
          data[idx + 1] = value;
          data[idx + 2] = value;
          data[idx + 3] = 255;
        }
      }
      offCtx.putImageData(imageData, 0, 0);
      ctx.drawImage(offCanvas, cx - radius, cy - radius);
      ctx.strokeStyle = '#000';
      const ratio = window.devicePixelRatio || 1;
      ctx.lineWidth = Math.max(2, size * 0.03) / ratio;
      ctx.beginPath();
      ctx.arc(cx, cy, radius - ctx.lineWidth / 2, 0, Math.PI * 2);
      ctx.stroke();
    }

    function renderStimulus(sf, ori) {
      drawBackground();
      const diameter = Math.min(displayWidth, displayHeight) * 0.36;
      const centerX = displayWidth / 2;
      const centerY = displayHeight / 2;
      drawGabor(ctx, centerX, centerY, diameter, ori, sf);
    }

    function showFeedback(text, color) {
      feedbackOverlay.textContent = text;
      feedbackOverlay.style.color = color;
      feedbackOverlay.style.opacity = 1;
    }

    function hideFeedback() {
      feedbackOverlay.style.opacity = 0;
    }

    function updateStatus(text) {
      // Status提示已移除界面，此处仅为兼容保留。
      if (text) {
        console.log(text);
      }
    }

    function showWaitOverlay(message) {
      if (!waitOverlay) return;
      waitOverlayText.textContent = message;
      waitOverlay.classList.add('visible');
    }

    function hideWaitOverlay() {
      if (!waitOverlay) return;
      waitOverlay.classList.remove('visible');
    }

    function setExitButtonVisibility(show) {
      if (!exitButton) return;
      exitButton.style.display = show ? 'block' : 'none';
    }

    function forceResolveWaitOverlay() {
      if (typeof waitOverlayFinish === 'function') {
        waitOverlayFinish();
      }
    }

    // -------------------------
    // Response handling
    // -------------------------
    function waitForResponse() {
      return new Promise(resolve => {
        const startTime = performance.now();
        const timer = setTimeout(() => {
          if (responseState && responseState.resolve === resolve) {
            responseState = null;
          }
          resolve({ resp: 'NA', rtMs: null, timeout: true, aborted: aborted });
        }, RESP_LIMIT_MS);
        responseState = {
          resolve,
          timer,
          startTime
        };
      });
    }

    function clearResponseState() {
      if (responseState) {
        clearTimeout(responseState.timer);
        responseState = null;
      }
    }

    function deliverResponse(key) {
      if (!experimentRunning) return;
      if (!responseState) return;
      if (key !== 'a' && key !== 'b') return;
      clearTimeout(responseState.timer);
      const now = performance.now();
      const rtMs = now - responseState.startTime;
      const resolver = responseState.resolve;
      responseState = null;
      resolver({ resp: key, rtMs, timeout: false, aborted: false });
    }

    function handleKeyDown(event) {
      if (event.key === 'Escape') {
        event.preventDefault();
        if (experimentRunning && !aborted) {
          aborted = true;
          terminateExperimentEarly();
        }
        return;
      }
      if (!experimentRunning) return;
      if (!responseState) return;
      const key = event.key.toLowerCase();
      deliverResponse(key);
    }

    document.addEventListener('keydown', handleKeyDown);

    responseButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        const key = btn.getAttribute('data-key');
        deliverResponse(key);
      });
      btn.addEventListener('touchstart', (event) => {
        event.preventDefault();
        const key = btn.getAttribute('data-key');
        deliverResponse(key);
      }, { passive: false });
    });

    if (exitButton) {
      exitButton.addEventListener('click', () => {
        if (!experimentRunning) return;
        aborted = true;
        forceResolveWaitOverlay();
        terminateExperimentEarly();
      });
    }

    function buildTaskIntroMessage() {
      return '这是一个分类学习实验，你需要自己摸索图形属于 A 还是 B。请按任意键继续。';
    }

    function buildRuleChangeMessage() {
      return '提示：规则将发生变化，请按任意键继续。';
    }

    function buildGeneralizationIntroMessage(task) {
      const taskLabel = task === 'RB' ? 'RB' : 'II';
      return `提示：即将进入无反馈的 ${taskLabel} 检验阶段，请继续按照当前规则作答。按任意键继续。`;
    }

    async function waitAnyKey(message) {
      drawBlank();
      showWaitOverlay(message);
      return new Promise(resolve => {
        let resolved = false;

        const cleanup = () => {
          document.removeEventListener('keydown', keyHandler, true);
          document.removeEventListener('pointerdown', pointerHandler, true);
          waitOverlayButton.removeEventListener('click', buttonHandler, true);
          waitOverlayButton.removeEventListener('pointerdown', buttonPointerHandler, true);
          responseButtons.forEach(btn => {
            btn.removeEventListener('pointerdown', buttonPointerHandler, true);
          });
          waitOverlayFinish = null;
        };

        const finish = () => {
          if (resolved) return;
          resolved = true;
          cleanup();
          hideWaitOverlay();
          drawBlank();
          resolve();
        };

        waitOverlayFinish = finish;

        const keyHandler = (event) => {
          const key = event.key ? event.key.toLowerCase() : '';
          if (key === 'a' || key === 'b' || key === ' ' || key === 'spacebar' || key === 'space') {
            event.preventDefault();
            finish();
          }
        };

        const pointerHandler = (event) => {
          event.preventDefault();
          finish();
        };

        const buttonPointerHandler = (event) => {
          event.preventDefault();
          finish();
        };

        const buttonHandler = (event) => {
          event.preventDefault();
          finish();
        };

        document.addEventListener('keydown', keyHandler, true);
        document.addEventListener('pointerdown', pointerHandler, true);
        waitOverlayButton.addEventListener('click', buttonHandler, true);
        waitOverlayButton.addEventListener('pointerdown', buttonPointerHandler, true);
        responseButtons.forEach(btn => {
          btn.addEventListener('pointerdown', buttonPointerHandler, true);
        });
      });
    }

    // -------------------------
    // Trial execution
    // -------------------------
    async function runBlock(task, trials, orderInSession) {
      if (!trials || trials.length === 0) return;
      currentBlockName = trials[0].blockName;
      const blockIndex = trials[0].blockIndex || 1;
      const noFeedbackBlock = trials.every(trial => trial.phase === 'gen');
      const counts = { A: 0, B: 0 };
      const sfCounts = { 3: 0, 4: 0, 5: 0, 6: 0 };
      const binCounts = { b1: 0, b2: 0, b3: 0 };
      let nearCount = 0;
      let nearA = 0, nearB = 0, farA = 0, farB = 0;
      let nearSymbolic = 0;
      trials.forEach(t => {
        counts[t.label] = (counts[t.label] || 0) + 1;
        sfCounts[t.sf] = (sfCounts[t.sf] || 0) + 1;
        const binKey = t.binKey || determineBinKey(t.ori);
        if (binKey) binCounts[binKey] += 1;
        if (t.nearFlag) nearCount += 1;
        if (t.nearFlag && t.symbolicFlag) nearSymbolic += 1;
        if (t.nearFlag) {
          if (t.label === 'A') nearA += 1; else nearB += 1;
        } else {
          if (t.label === 'A') farA += 1; else farB += 1;
        }
      });
      const nearRatioNum = trials.length ? nearCount / trials.length : 0;
      const nearRatioStr = task === 'II' ? nearRatioNum.toFixed(3) : '';
      const symbolicRatioNum = nearCount ? nearSymbolic / nearCount : 0;
      const qcCountsPayload = {
        counts: { ...counts },
        sfCounts: { ...sfCounts },
        binCounts: { ...binCounts },
        near: {
          ratio: Number(nearRatioNum.toFixed(3)),
          count: nearCount,
          nearA,
          nearB,
          farA,
          farB,
          symbolicCount: nearSymbolic,
          symbolicRatio: Number(symbolicRatioNum.toFixed(3))
        }
      };
      const qcCountsJson = JSON.stringify(qcCountsPayload);
      const sfSummary = getActiveSfLevels().map(level => `sf${level}=${sfCounts[level] || 0}`).join(', ');
      console.log(`QC ${currentBlockName}: A=${counts.A}, B=${counts.B}, ${sfSummary}, bin1=${binCounts.b1}, bin2=${binCounts.b2}, bin3=${binCounts.b3}, near=${nearRatioNum.toFixed(3)}, nearA=${nearA}, nearB=${nearB}, farA=${farA}, farB=${farB}, nearSymbolic=${nearSymbolic}`);
      for (let i = 0; i < trials.length; i++) {
        if (aborted) break;
        const trial = trials[i];
        const trialStartUTC = new Date().toISOString();
        if (USE_FIXATION) {
          drawFixation();
          await wait(FIX_MS);
          if (aborted) break;
        }
        if (USE_PREBLANK) {
          drawBlank();
          await wait(PREBLANK_MS);
          if (aborted) break;
        }
        renderStimulus(trial.sf, trial.ori);
        const response = await waitForResponse();
        clearResponseState();
        drawBlank();
        if (!noFeedbackBlock && participantMeta.delayMs > 0) {
          drawFixation();
          await wait(participantMeta.delayMs);
          if (aborted) break;
          drawBlank();
        }
        if (response.aborted || aborted) {
          break;
        }
        let rtSec = '';
        let respKey = response.resp;
        if (!response.timeout && response.rtMs != null) {
          rtSec = (response.rtMs / 1000).toFixed(3);
        }
        if (response.timeout) {
          respKey = 'NA';
        }
        const corr = respKey === trial.correctKey ? 1 : 0;
        if (!noFeedbackBlock) {
          showFeedback(corr ? 'Right' : 'Wrong', corr ? '#2ecc71' : '#e74c3c');
          await wait(FEEDBACK_MS);
        }
        hideFeedback();
        if (aborted) break;
        dataRows.push([
          participantId,
          participantMeta.group,
          participantMeta.orderCode,
          participantMeta.serial,
          participantMeta.sessionIndex,
          participantMeta.movement,
          task,
          trial.iiStructure || '',
          orderInSession,
          trial.blockName,
          blockIndex,
          trial.trialIndex,
          trial.sf,
          trial.ori.toFixed(3),
          trial.nearFlag,
          trial.label,
          trial.correctKey,
          respKey,
          corr,
          rtSec,
          participantMeta.delayMs,
          trialStartUTC,
          nearRatioStr,
          qcCountsJson
        ]);
      }
    }

    // -------------------------
    // Experiment control
    // -------------------------
    async function startExperiment() {
      experimentRunning = true;
      aborted = false;
      setExitButtonVisibility(true);
      dataRows = [];
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);
      let rbBlockSet = { train: [], gen: [] };
      let iiBlockSet = { train: [], gen: [] };
      try {
        rbBlockSet = makeTrialsRB_balancedV3(participantId, sessionConfig.rbRule);
        iiBlockSet = makeTrialsII_balancedV3(participantId, sessionConfig.iiPlan);
        const needsRB = participantMeta.taskOrder.includes('RB');
        const needsII = participantMeta.taskOrder.includes('II');
        if (needsRB && (!rbBlockSet.train || !rbBlockSet.train.length)) {
          throw new Error('RB 刺激集合为空');
        }
        if (needsII && (!iiBlockSet.train || !iiBlockSet.train.length)) {
          throw new Error('II 刺激集合为空');
        }
      } catch (err) {
        console.error('试次生成失败', err);
        alert(`试次生成失败：${err && err.message ? err.message : err}`);
        experimentRunning = false;
        setExitButtonVisibility(false);
        forceResolveWaitOverlay();
        hideWaitOverlay();
        startScreen.style.display = 'flex';
        experimentContainer.style.display = 'none';
        return;
      }
      const blockStore = { RB: rbBlockSet, II: iiBlockSet };
      const totalTasks = participantMeta.taskOrder.length;
      for (let t = 0; t < totalTasks; t++) {
        const task = participantMeta.taskOrder[t];
        const blockSet = blockStore[task] || { train: [], gen: [] };
        const trainBlocks = blockSet.train || [];
        const genBlocks = blockSet.gen || [];
        if (!trainBlocks.length) {
          console.warn('未找到任务区块', { task });
          continue;
        }
        if (t === 0) {
          await waitAnyKey(buildTaskIntroMessage());
          if (aborted) break;
        } else {
          const prevTask = participantMeta.taskOrder[t - 1];
          if (task !== prevTask) {
            await waitAnyKey(buildRuleChangeMessage());
            if (aborted) break;
          }
        }
        for (let b = 0; b < trainBlocks.length; b++) {
          if (aborted) break;
          await runBlock(task, trainBlocks[b], t + 1);
        }
        if (aborted) break;
        if (genBlocks.length) {
          await waitAnyKey(buildGeneralizationIntroMessage(task));
          if (aborted) break;
          for (let g = 0; g < genBlocks.length; g++) {
            if (aborted) break;
            await runBlock(task, genBlocks[g], t + 1);
          }
        }
        if (aborted) break;
      }
      if (!aborted) {
        concludeExperiment();
      }
    }

    function buildCSVContent(rows) {
      const allRows = [CSV_HEADER.join(',')];
      for (const row of rows) {
        const formatted = row.map(value => {
          if (value === null || value === undefined) return '';
          const str = String(value);
          if (str.includes(',') || str.includes('"') || str.includes('\n')) {
            return '"' + str.replace(/"/g, '""') + '"';
          }
          return str;
        }).join(',');
        allRows.push(formatted);
      }
      return allRows.join('\n');
    }

    function downloadCSV(filename, rows) {
      if (pendingDownload) return;
      const csvContent = buildCSVContent(rows);
      const blob = new Blob([csvContent], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement('a');
      anchor.href = url;
      anchor.download = filename;
      document.body.appendChild(anchor);
      anchor.click();
      document.body.removeChild(anchor);
      URL.revokeObjectURL(url);
      pendingDownload = true;
    }

    function concludeExperiment() {
      experimentRunning = false;
      setExitButtonVisibility(false);
      forceResolveWaitOverlay();
      hideWaitOverlay();
      updateStatus('实验完成，CSV 已自动下载。');
      const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
      const filename = `gabor_${participantId || 'anon'}_${timestamp}.csv`;
      downloadCSV(filename, dataRows);
      showCompletionMessage();
    }

    function terminateExperimentEarly() {
      if (!experimentRunning) return;
      clearResponseState();
      experimentRunning = false;
      setExitButtonVisibility(false);
      forceResolveWaitOverlay();
      hideWaitOverlay();
      updateStatus('实验已中止，CSV 已自动下载。');
      const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
      const filename = `gabor_${participantId || 'anon'}_${timestamp}.csv`;
      downloadCSV(filename, dataRows);
      showCompletionMessage();
    }

    function showCompletionMessage() {
      hideFeedback();
      drawBlank();
      ctx.fillStyle = '#fff';
      ctx.font = '28px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('感谢参与实验！', displayWidth / 2, displayHeight / 2);
    }

    function resetState() {
      aborted = false;
      pendingDownload = false;
      setExitButtonVisibility(false);
      forceResolveWaitOverlay();
      hideWaitOverlay();
    }

    async function handleStart() {
      participantId = participantInput.value.trim();
      if (!participantId) {
        alert('请输入被试编号。');
        return;
      }
      const sessionIndex = requestSessionIndex();
      if (!sessionIndex) {
        alert('请先选择本次场次（1 或 2）。');
        return;
      }
      resetState();
      participantMeta = parseIdV2(participantId, sessionIndex);
      if (!participantMeta) {
        alert('编号格式应为字母 A/B + 1~4 的编号 + 至少一位序号，例如 A11、B204。');
        return;
      }
      sessionConfig = sessionParams(participantMeta.sessionIndex);
      console.log(`ID 解析: group=${participantMeta.group}, orderCode=${participantMeta.orderCode}, serial=${participantMeta.serial}, session=${participantMeta.sessionIndex}, movement=${participantMeta.movement}, taskOrder=${participantMeta.taskOrder.join('>')}, delayMs=${participantMeta.delayMs}`);
      const iiFormulaSummary = (sessionConfig.iiPlan || []).map(entry => {
        const structure = getIIStructureConfig(entry.key);
        return formatIIStructureFormula(structure);
      }).join(' | ');
      console.log(`II 判定公式：${iiFormulaSummary}`);
      startScreen.style.display = 'none';
      experimentContainer.style.display = 'flex';
      updateStatus('正在尝试进入全屏模式...');
      try {
        if (document.fullscreenEnabled) {
          await document.documentElement.requestFullscreen();
        }
      } catch (err) {
        console.warn('Fullscreen request failed:', err);
      }
      await wait(100);
      updateStatus('正在准备试次，请稍候...');
      startExperiment();
    }

    startButton.addEventListener('click', handleStart);

    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement && experimentRunning && !aborted) {
        // If participant exits fullscreen manually, continue but note in status.
        updateStatus('已退出全屏，实验仍将继续。');
      }
    });

    window.addEventListener('load', () => {
      resizeCanvas();
      drawBlank();
    });
  </script>
</body>
</html>
