<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>Gabor 分类实验</title>
  <style>
    :root {
      color-scheme: light dark;
    }
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }
    body, html {
      margin: 0;
      height: 100%;
      background: #888;
      color: #111;
    }
    #startScreen, #experimentContainer {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;
    }
    #experimentContainer {
      display: none;
    }
    #participantInput {
      padding: 10px 14px;
      font-size: 18px;
      border-radius: 6px;
      border: 1px solid #333;
      min-width: 260px;
    }
    #startButton {
      padding: 12px 24px;
      font-size: 18px;
      border-radius: 6px;
      border: none;
      background: #2c7be5;
      color: #fff;
      cursor: pointer;
    }
    #startButton:disabled {
      background: #777;
      cursor: not-allowed;
    }
    #canvasWrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: #888;
    }
    #feedbackOverlay {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: 48px;
      font-weight: bold;
      text-shadow: 0 0 10px rgba(0,0,0,0.5);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.1s ease;
    }
    #responseButtons {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 16px;
      z-index: 10;
    }
    #responseButtons button {
      padding: 14px 24px;
      font-size: 18px;
      border-radius: 999px;
      border: none;
      background: rgba(0,0,0,0.6);
      color: #fff;
      min-width: 140px;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    #responseButtons button:active {
      background: rgba(0,0,0,0.8);
    }
    #exitButton {
      position: fixed;
      top: 20px;
      left: 20px;
      padding: 10px 18px;
      font-size: 16px;
      border: none;
      border-radius: 999px;
      background: rgba(220, 53, 69, 0.9);
      color: #fff;
      cursor: pointer;
      z-index: 12;
      display: none;
    }
    #waitOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      color: #fff;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      z-index: 20;
    }
    #waitOverlay.visible {
      display: flex;
    }
    #waitOverlay .wait-box {
      background: rgba(0,0,0,0.55);
      padding: 28px 36px;
      border-radius: 16px;
      max-width: 520px;
      line-height: 1.5;
      font-size: 20px;
    }
    #waitOverlay button {
      margin-top: 18px;
      padding: 12px 32px;
      border: none;
      border-radius: 999px;
      font-size: 18px;
      background: #2c7be5;
      color: #fff;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="startScreen">
    <label for="participantInput">被试编号</label>
    <input id="participantInput" type="text" autocomplete="off" />
    <button id="startButton">开始</button>
    <p style="max-width: 420px; text-align: center; line-height: 1.4; font-size: 14px; color: #222;">
      点击“开始”进入 Gabor 分类实验。作答可按键 A/B，或点击屏幕下方的 A 类、B 类按钮。随时按下 Escape 可终止并立刻下载已收集数据。
    </p>
  </div>
  <div id="experimentContainer">
    <div id="canvasWrapper">
      <canvas id="gaborCanvas"></canvas>
      <div id="feedbackOverlay"></div>
    </div>
    <div id="responseButtons">
      <button class="responseButton" data-key="a">选择 A 类（键盘 A）</button>
      <button class="responseButton" data-key="b">选择 B 类（键盘 B）</button>
    </div>
  </div>
  <button id="exitButton">退出实验</button>
  <div id="waitOverlay">
    <div class="wait-box">
      <div id="waitOverlayText">提示：接下来规则将发生变化，请按任意键继续。</div>
      <button id="waitOverlayButton">点击继续</button>
    </div>
  </div>
  <script>
    // -------------------------
    // Configurable constants (do not mutate elsewhere)
    // -------------------------
    const N_RB = 200;
    const N_II = 240;

    const USE_FIXATION = true,  FIX_MS = 500;
    const USE_PREBLANK = false, PREBLANK_MS = 0;
    const RESP_LIMIT_MS = 3000;
    const FEEDBACK_MS   = 500;

    const ORI_MIN = -15, ORI_MAX = 15;
    const SF_LINES = [3, 4, 5, 6]; // We store the visible黑白成对条纹数量（cycle count）到 CSV。

    const ORI_JITTER = 0.5;

    const ORDER_CODE_PLANS = {
      '1': {
        session1: { movement: 'Seated', taskOrder: ['RB', 'II'] },
        session2: { movement: 'Walking', taskOrder: ['II', 'RB'] }
      },
      '2': {
        session1: { movement: 'Seated', taskOrder: ['II', 'RB'] },
        session2: { movement: 'Walking', taskOrder: ['RB', 'II'] }
      },
      '3': {
        session1: { movement: 'Walking', taskOrder: ['RB', 'II'] },
        session2: { movement: 'Seated', taskOrder: ['II', 'RB'] }
      },
      '4': {
        session1: { movement: 'Walking', taskOrder: ['II', 'RB'] },
        session2: { movement: 'Seated', taskOrder: ['RB', 'II'] }
      }
    };

    const DELAYED_STAGE_MS = 2000;

    const II_NEAR_LOWER = 0.45;
    const II_NEAR_UPPER = 0.60; // acceptable range: [45%, 60%]

    const RB_BIN_PLAN = [
      { bin1: 14, bin2: 12, bin3: 14 },
      { bin1: 12, bin2: 14, bin3: 14 },
      { bin1: 14, bin2: 14, bin3: 12 },
      { bin1: 14, bin2: 12, bin3: 14 },
      { bin1: 12, bin2: 14, bin3: 14 }
    ];

    const II_BIN_SIZE_PER_BLOCK = 16; // three bins * 16 = 48 per block

    const CSV_HEADER = [
      'participant','group','orderCode','serial','sessionIndex','movement','task','orderInSession',
      'blockName','blockIndex','trialIndex','sf','ori','nearFlag','label','correctKey','resp','corr','rt','delayMs','trialStartUTC','qc_near_ratio','qc_counts_json'
    ];

    // -------------------------
    // DOM references
    // -------------------------
    const startScreen = document.getElementById('startScreen');
    const experimentContainer = document.getElementById('experimentContainer');
    const startButton = document.getElementById('startButton');
    const participantInput = document.getElementById('participantInput');
    const canvas = document.getElementById('gaborCanvas');
    const ctx = canvas.getContext('2d');
    const feedbackOverlay = document.getElementById('feedbackOverlay');
    const responseButtons = document.querySelectorAll('.responseButton');
    const exitButton = document.getElementById('exitButton');
    const waitOverlay = document.getElementById('waitOverlay');
    const waitOverlayText = document.getElementById('waitOverlayText');
    const waitOverlayButton = document.getElementById('waitOverlayButton');

    // -------------------------
    // State variables
    // -------------------------
    let experimentRunning = false;
    let aborted = false;
    let participantId = '';
    let participantMeta = null;
    let sessionConfig = null;
    let dataRows = [];
    let responseState = null;
    let currentBlockName = '';
    let pendingDownload = false;
    let displayWidth = window.innerWidth;
    let displayHeight = window.innerHeight;
    let waitOverlayFinish = null;

    // -------------------------
    // Utility helpers
    // -------------------------
    function resizeCanvas() {
      const ratio = window.devicePixelRatio || 1;
      displayWidth = window.innerWidth;
      displayHeight = window.innerHeight;
      canvas.width = Math.round(displayWidth * ratio);
      canvas.height = Math.round(displayHeight * ratio);
      canvas.style.width = displayWidth + 'px';
      canvas.style.height = displayHeight + 'px';
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    }

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function wait(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function determineBinKey(ori) {
      const absMag = Math.abs(ori);
      if (absMag >= 1 && absMag <= 5) return 'b1';
      if (absMag > 5 && absMag <= 10) return 'b2';
      if (absMag > 10 && absMag <= 15) return 'b3';
      return null;
    }

    function hashString(str) {
      let h = 1779033703 ^ str.length;
      for (let i = 0; i < str.length; i++) {
        h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
        h = (h << 13) | (h >>> 19);
      }
      return function rng() {
        h = Math.imul(h ^ (h >>> 16), 2246822507);
        h = Math.imul(h ^ (h >>> 13), 3266489909);
        h ^= h >>> 16;
        return (h >>> 0) / 4294967296;
      };
    }

    function shuffleInPlace(array, rng) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(rng() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }

    function shuffleBlockTrials(trials, seed) {
      const rngShuffle = hashString(`${seed}_shuffle`);
      const rngSwap = hashString(`${seed}_swap`);
      const shuffled = trials.map(trial => ({ ...trial }));
      shuffleInPlace(shuffled, rngShuffle);
      const tolerance = 0.01;
      const maxAttempts = Math.max(10, shuffled.length * 2);
      for (let attempt = 0; attempt < maxAttempts; attempt++) {
        let violationIndex = -1;
        for (let i = 0; i < shuffled.length - 1; i++) {
          const a = shuffled[i];
          const b = shuffled[i + 1];
          if (Math.sign(a.ori) !== Math.sign(b.ori) && Math.abs(Math.abs(a.ori) - Math.abs(b.ori)) < tolerance) {
            violationIndex = i;
            break;
          }
        }
        if (violationIndex === -1) break;
        let swapIdx = Math.floor(rngSwap() * shuffled.length);
        if (swapIdx === violationIndex || swapIdx === violationIndex + 1) {
          swapIdx = (swapIdx + 2) % shuffled.length;
        }
        [shuffled[violationIndex + 1], shuffled[swapIdx]] = [shuffled[swapIdx], shuffled[violationIndex + 1]];
      }
      shuffled.forEach((trial, idx) => {
        trial.trialIndex = idx + 1;
      });
      return shuffled;
    }

    function analyzeLabelRuns(trials) {
      let maxRun = 1;
      let currentRun = 1;
      for (let i = 1; i < trials.length; i++) {
        if (trials[i].label === trials[i - 1].label) {
          currentRun += 1;
        } else {
          if (currentRun > maxRun) maxRun = currentRun;
          currentRun = 1;
        }
      }
      if (currentRun > maxRun) maxRun = currentRun;
      return maxRun;
    }

    function maxWindowLabelDiff(trials, windowSize = 12) {
      if (trials.length < windowSize) return 0;
      const prefixA = new Array(trials.length + 1).fill(0);
      for (let i = 0; i < trials.length; i++) {
        prefixA[i + 1] = prefixA[i] + (trials[i].label === 'A' ? 1 : 0);
      }
      let maxDiff = 0;
      for (let start = 0; start <= trials.length - windowSize; start++) {
        const countA = prefixA[start + windowSize] - prefixA[start];
        const countB = windowSize - countA;
        const diff = Math.abs(countA - countB);
        if (diff > maxDiff) maxDiff = diff;
      }
      return maxDiff;
    }

    function shuffleIIBlockTrialsWithAntiStreak(trials, seed) {
      const maxAttempts = 800;
      let bestCandidate = null;
      let bestScore = Infinity;
      for (let attempt = 0; attempt < maxAttempts; attempt++) {
        const candidate = shuffleBlockTrials(trials, `${seed}_anti${attempt}`);
        const maxRun = analyzeLabelRuns(candidate);
        const windowDiff = maxWindowLabelDiff(candidate, 12);
        const runPenalty = Math.max(0, maxRun - 3);
        const windowPenalty = Math.max(0, windowDiff - 2);
        const score = runPenalty * 100 + windowPenalty * 10 + attempt * 0.001;
        if (runPenalty === 0 && windowPenalty === 0) {
          return candidate;
        }
        if (score < bestScore) {
          bestScore = score;
          bestCandidate = candidate;
        }
      }
      console.warn('II block ordering fell back to best-effort anti-streak sequence', { seed });
      return bestCandidate || shuffleBlockTrials(trials, `${seed}_fallback`);
    }

    // -------------------------
    // Participant driven configuration
    // -------------------------
    function parseIdV2(id, sessionIndex) {
      const trimmed = (id || '').trim().toUpperCase();
      const match = trimmed.match(/^([AB])([1-4])(\d+)$/);
      if (!match) {
        return null;
      }
      if (sessionIndex !== 1 && sessionIndex !== 2) {
        return null;
      }
      const group = match[1];
      const orderCode = match[2];
      const serial = match[3];
      const plan = ORDER_CODE_PLANS[orderCode];
      if (!plan) {
        return null;
      }
      const sessionPlan = sessionIndex === 1 ? plan.session1 : plan.session2;
      if (!sessionPlan) {
        return null;
      }
      const delayMs = (group === 'B' && sessionPlan.movement === 'Walking') ? DELAYED_STAGE_MS : 0;
      return {
        group,
        orderCode,
        serial,
        sessionIndex,
        movement: sessionPlan.movement,
        taskOrder: [...sessionPlan.taskOrder],
        delayMs
      };
    }

    function requestSessionIndex() {
      while (true) {
        const response = window.prompt('本次是第几次进行实验？请选择 1 或 2');
        if (response === null) {
          return null;
        }
        const trimmed = response.trim();
        if (trimmed === '1' || trimmed === '2') {
          return Number(trimmed);
        }
        alert('请输入数字 1 或 2。');
      }
    }

    function sessionParams(sessionIndex) {
      if (sessionIndex === 2) {
        return { rbRule: 'A_GT7', wsf: 0.35, wori: 0.65 };
      }
      return { rbRule: 'A_LT7', wsf: 0.65, wori: 0.35 };
    }

    // -------------------------
    // Labeling functions
    // -------------------------
    function labelRB(oriDeg, rbRule) {
      const absOri = Math.abs(oriDeg);
      if (rbRule === 'A_LT7') {
        return absOri < 7 ? 'A' : 'B';
      }
      return absOri > 7 ? 'A' : 'B';
    }

    function computeIIScore(sfLines, oriDeg, weights) {
      const x = (sfLines - 4.5) / 1.5;
      const y = oriDeg / 15;
      const raw = weights.wsf * x + weights.wori * y;
      const norm = Math.sqrt(weights.wsf * weights.wsf + weights.wori * weights.wori);
      return { x, y, raw, norm };
    }

    function labelII(sfLines, oriDeg, weights) {
      return computeIIScore(sfLines, oriDeg, weights).raw > 0 ? 'A' : 'B';
    }

    // -------------------------
    // Stimulus generation helpers
    // -------------------------
    function buildSfSchedule(total, seed) {
      const perLevel = Math.floor(total / SF_LINES.length);
      let remainder = total - perLevel * SF_LINES.length;
      const schedule = [];
      for (const sf of SF_LINES) {
        const count = perLevel + (remainder > 0 ? 1 : 0);
        if (remainder > 0) remainder--;
        for (let i = 0; i < count; i++) {
          schedule.push(sf);
        }
      }
      shuffleInPlace(schedule, hashString(`${seed}_sfSchedule`));
      return schedule;
    }

    function buildSfScheduleForSet(total, allowedSfs, seed) {
      const perLevel = Math.floor(total / allowedSfs.length);
      let remainder = total - perLevel * allowedSfs.length;
      const schedule = [];
      for (const sf of allowedSfs) {
        const count = perLevel + (remainder > 0 ? 1 : 0);
        if (remainder > 0) remainder--;
        for (let i = 0; i < count; i++) {
          schedule.push(sf);
        }
      }
      shuffleInPlace(schedule, hashString(`${seed}_subsetSf`));
      return schedule;
    }

    function buildSymmetricOrientationList(minMag, maxMag, includeZero, total, seed) {
      const cycle = [];
      if (includeZero && minMag === 0) {
        cycle.push(0);
      }
      const startMag = Math.max(1, minMag);
      if (startMag > maxMag && !(includeZero && minMag === 0)) {
        return [];
      }
      for (let mag = startMag; mag <= maxMag; mag++) {
        cycle.push(-mag, mag);
      }
      if (cycle.length === 0) {
        return [];
      }
      const result = [];
      const baseCycles = Math.floor(total / cycle.length);
      for (let i = 0; i < baseCycles; i++) {
        const copy = [...cycle];
        shuffleInPlace(copy, hashString(`${seed}_cycle_${i}`));
        result.push(...copy);
      }
      let remaining = total - baseCycles * cycle.length;
      if (includeZero && minMag === 0 && remaining > 0) {
        result.push(0);
        remaining -= 1;
      }
      if (includeZero && minMag === 0 && remaining % 2 === 1) {
        result.push(0);
        remaining -= 1;
      }
      let mag = startMag;
      while (remaining > 0) {
        if (mag > maxMag) {
          mag = startMag;
        }
        if (remaining >= 2) {
          result.push(-mag, mag);
          remaining -= 2;
          mag += 1;
        } else {
          break;
        }
      }
      return result.slice(0, total);
    }

    function symmetricPairMagnitudes(start, end, pairCount) {
      const mags = [];
      let mag = start;
      for (let i = 0; i < pairCount; i++) {
        mags.push(mag);
        mag += 1;
        if (mag > end) mag = start;
      }
      return mags;
    }

    function buildRBBin(magStart, magEnd, count, seed, binKey, jitterMax = 0.4) {
      const pairCount = count / 2;
      const mags = symmetricPairMagnitudes(magStart, magEnd, pairCount);
      const rng = hashString(seed);
      const orientations = [];
      mags.forEach((mag, idx) => {
        const jitter = (rng() * 2 - 1) * jitterMax;
        const magWithJitter = clamp(mag + jitter, ORI_MIN, ORI_MAX);
        orientations.push({ ori: magWithJitter, binKey }, { ori: -magWithJitter, binKey });
      });
      shuffleInPlace(orientations, hashString(`${seed}_shuffle`));
      return orientations;
    }

    function makeTrialsRB_balancedV3(participantId, rbRule) {
      const blocks = [];
      const targetPerBlock = 40;
      const targetPerClass = targetPerBlock / 2;
      RB_BIN_PLAN.forEach((plan, blockIdx) => {
        const rngSeed = `${participantId}_RB_v3_block${blockIdx}`;
        let aBin1 = 0, aBin2 = 0, aBin3 = 0, bBin1 = 0, bBin2 = 0, bBin3 = 0;
        if (rbRule === 'A_LT7') {
          aBin1 = plan.bin1;
          aBin3 = 0;
          aBin2 = targetPerClass - aBin1;
          bBin3 = plan.bin3;
          bBin2 = plan.bin2 - aBin2;
          bBin1 = 0;
        } else {
          aBin3 = plan.bin3;
          aBin1 = 0;
          aBin2 = targetPerClass - aBin3;
          bBin1 = plan.bin1;
          bBin2 = plan.bin2 - aBin2;
          bBin3 = 0;
        }
        aBin2 = Math.max(0, aBin2);
        bBin2 = Math.max(0, bBin2);

        const orientations = [];
        if (aBin1 > 0) orientations.push(...buildRBBin(1, 5, aBin1, `${rngSeed}_a_bin1`, 'b1'));
        if (bBin1 > 0) orientations.push(...buildRBBin(1, 5, bBin1, `${rngSeed}_b_bin1`, 'b1'));

        if (aBin2 > 0) {
          const mag = rbRule === 'A_LT7' ? 6 : 9;
          orientations.push(...buildRBBin(mag, mag, aBin2, `${rngSeed}_a_bin2`, 'b2'));
        }
        if (bBin2 > 0) {
          const mag = rbRule === 'A_LT7' ? 9 : 6;
          const endMag = rbRule === 'A_LT7' ? 10 : 6;
          orientations.push(...buildRBBin(mag, endMag, bBin2, `${rngSeed}_b_bin2`, 'b2'));
        }

        if (aBin3 > 0) orientations.push(...buildRBBin(11, 15, aBin3, `${rngSeed}_a_bin3`, 'b3'));
        if (bBin3 > 0) orientations.push(...buildRBBin(11, 15, bBin3, `${rngSeed}_b_bin3`, 'b3'));

        shuffleInPlace(orientations, hashString(`${rngSeed}_order`));
        const sfSchedule = buildSfSchedule(targetPerBlock, `${rngSeed}_sf`);
        const trials = orientations.map((item, idx) => {
          const sf = sfSchedule[idx];
          const ori = item.ori;
          const label = labelRB(ori, rbRule);
          return {
            blockName: `RB-${blockIdx + 1}`,
            blockIndex: blockIdx + 1,
            trialIndex: idx + 1,
            sf,
            ori,
            binKey: item.binKey || determineBinKey(ori),
            nearFlag: 0,
            label,
            correctKey: label === 'A' ? 'a' : 'b'
          };
        });
        const shuffled = shuffleBlockTrials(trials, `${rngSeed}_finalOrder`);
        blocks.push(shuffled);
      });
      return blocks;
    }

    function buildIIPairsForBin(binStart, binEnd, pairCount, seed, binKey) {
      const mags = symmetricPairMagnitudes(binStart, binEnd, pairCount);
      const rng = hashString(seed);
      const pairs = [];
      mags.forEach((mag, idx) => {
        const jitter = (rng() * 2 - 1) * ORI_JITTER;
        const magWithJitter = clamp(mag + jitter, ORI_MIN, ORI_MAX);
        const pos = { ori: magWithJitter, binKey };
        const neg = { ori: -magWithJitter, binKey };
        pairs.push([pos, neg]);
      });
      shuffleInPlace(pairs, hashString(`${seed}_shuffle`));
      return pairs;
    }

    function makeTrialsII_balancedV3(participantId, weights) {
      const blocks = [];
      const pairsPerBlock = 24; // 48 trials /2
      for (let blockIdx = 0; blockIdx < 5; blockIdx++) {
        const ratioRng = hashString(`${participantId}_II_v3_block${blockIdx}_ratio`);
        const desiredRatio = II_NEAR_LOWER + ratioRng() * (II_NEAR_UPPER - II_NEAR_LOWER);
        const minNear = Math.ceil(48 * II_NEAR_LOWER);
        const maxNear = Math.floor(48 * II_NEAR_UPPER);
        let desiredNear = Math.round(48 * desiredRatio);
        desiredNear = clamp(desiredNear, minNear, maxNear);
        if (desiredNear % 2 === 1) {
          if (desiredNear + 1 <= maxNear) desiredNear += 1; else desiredNear -= 1;
        }
        const desiredFar = 48 - desiredNear;

        let bestTrials = null;
        let bestScore = Infinity;
        for (let attempt = 0; attempt < 10; attempt++) {
          const seed = `${participantId}_II_v3_block${blockIdx}_attempt${attempt}`;
          const bin1Pairs = buildIIPairsForBin(1, 5, II_BIN_SIZE_PER_BLOCK / 2, `${seed}_bin1`, 'b1');
          const bin2Pairs = buildIIPairsForBin(6, 10, II_BIN_SIZE_PER_BLOCK / 2, `${seed}_bin2`, 'b2');
          const bin3Pairs = buildIIPairsForBin(11, 15, II_BIN_SIZE_PER_BLOCK / 2, `${seed}_bin3`, 'b3');
          const allPairs = [...bin1Pairs, ...bin2Pairs, ...bin3Pairs];
          shuffleInPlace(allPairs, hashString(`${seed}_pairOrder`));

          const sfPairs = [];
          SF_LINES.forEach(sf => {
            for (let i = 0; i < 6; i++) sfPairs.push(sf);
          });
          shuffleInPlace(sfPairs, hashString(`${seed}_sfPairs`));

          const trials = [];
          let nearCount = 0;
          for (let p = 0; p < pairsPerBlock; p++) {
            const sf = sfPairs[p];
            const pair = allPairs[p % allPairs.length];
            pair.forEach((oriObj) => {
              const ori = oriObj.ori;
              const score = computeIIScore(sf, ori, weights);
              const dist = Math.abs(score.raw) / (score.norm || 1);
              const nearFlag = dist <= 0.5 ? 1 : 0;
              if (nearFlag) nearCount += 1;
              const label = score.raw > 0 ? 'A' : 'B';
              trials.push({
                blockName: `II-${blockIdx + 1}`,
                blockIndex: blockIdx + 1,
                trialIndex: trials.length + 1,
                sf,
                ori,
                binKey: oriObj.binKey || determineBinKey(ori),
                nearFlag,
                label,
                correctKey: label === 'A' ? 'a' : 'b'
              });
            });
          }

          const nearRatio = nearCount / trials.length;
          const countA = trials.filter(t => t.label === 'A').length;
          const sfCountsOk = SF_LINES.every(sf => trials.filter(t => t.sf === sf).length === 12);
          const binCounts = { b1: 0, b2: 0, b3: 0 };
          let nearA = 0, nearB = 0, farA = 0, farB = 0;
          trials.forEach(t => {
            const binKey = t.binKey || determineBinKey(t.ori);
            if (binKey) binCounts[binKey] += 1;
            if (t.nearFlag) {
              if (t.label === 'A') nearA += 1; else nearB += 1;
            } else {
              if (t.label === 'A') farA += 1; else farB += 1;
            }
          });
          const binsOk = binCounts.b1 === 16 && binCounts.b2 === 16 && binCounts.b3 === 16;
          const classOk = countA === trials.length / 2;
          const nearOk = nearCount === desiredNear || (nearCount >= minNear && nearCount <= maxNear);
          const nearBalanceOk = nearA === nearB;
          const farBalanceOk = farA === farB;
          const nearDiff = Math.abs(nearCount - desiredNear);
          const balancePenalty = (Math.abs(nearA - nearB) + Math.abs(farA - farB));
          const ratioPenalty = Math.abs(nearRatio - (desiredNear / trials.length));
          const candidateScore = nearDiff * 10 + balancePenalty + ratioPenalty;
          if (candidateScore < bestScore) {
            bestScore = candidateScore;
            bestTrials = trials;
          }
          if (sfCountsOk && binsOk && classOk && nearOk && nearBalanceOk && farBalanceOk && nearCount === desiredNear && farA + farB === desiredFar) {
            bestTrials = trials;
            break;
          }
        }
        if (bestTrials) {
          const finalOrder = shuffleIIBlockTrialsWithAntiStreak(
            bestTrials,
            `${participantId}_II_v3_block${blockIdx}_final`
          );
          blocks.push(finalOrder);
        }
      }
      return blocks;
    }
    // -------------------------
    // Stimulus rendering
    // -------------------------
    function drawBackground() {
      ctx.fillStyle = '#888';
      ctx.fillRect(0, 0, displayWidth, displayHeight);
    }

    function drawFixation() {
      drawBackground();
      const centerX = displayWidth / 2;
      const centerY = displayHeight / 2;
      ctx.strokeStyle = '#111';
      const ratio = window.devicePixelRatio || 1;
      ctx.lineWidth = 4 / ratio;
      const size = Math.min(displayWidth, displayHeight) * 0.02;
      ctx.beginPath();
      ctx.moveTo(centerX - size, centerY);
      ctx.lineTo(centerX + size, centerY);
      ctx.moveTo(centerX, centerY - size);
      ctx.lineTo(centerX, centerY + size);
      ctx.stroke();
    }

    function drawBlank() {
      drawBackground();
    }

    function drawGabor(ctx, cx, cy, diameterPx, oriDeg, sfPairs) {
      const size = Math.max(8, Math.round(diameterPx));
      const offCanvas = document.createElement('canvas');
      offCanvas.width = size;
      offCanvas.height = size;
      const offCtx = offCanvas.getContext('2d');
      const imageData = offCtx.createImageData(size, size);
      const data = imageData.data;
      const radius = size / 2;
      const orientation = oriDeg * Math.PI / 180;
      // 条纹换算：sfPairs 表示黑白为一组的可见条纹数量（cycle 数），freq=cycle/D 确保直径方向出现指定组数。
      const cycles = sfPairs;
      const freq = cycles / size;
      const cosOri = Math.cos(orientation);
      const sinOri = Math.sin(orientation);
      const sigma = radius * 0.45;
      const twoSigmaSq = 2 * sigma * sigma;
      const base = 128;
      const amplitude = 110;
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const dx = x - radius + 0.5;
          const dy = y - radius + 0.5;
          const distSq = dx * dx + dy * dy;
          const idx = (y * size + x) * 4;
          if (distSq > radius * radius) {
            data[idx] = 136;
            data[idx + 1] = 136;
            data[idx + 2] = 136;
            data[idx + 3] = 255;
            continue;
          }
          const rotX = dx * cosOri + dy * sinOri;
          const sine = Math.cos(2 * Math.PI * freq * rotX);
          const gaussian = Math.exp(-distSq / twoSigmaSq);
          const value = clamp(Math.round(base + gaussian * amplitude * sine), 0, 255);
          data[idx] = value;
          data[idx + 1] = value;
          data[idx + 2] = value;
          data[idx + 3] = 255;
        }
      }
      offCtx.putImageData(imageData, 0, 0);
      ctx.drawImage(offCanvas, cx - radius, cy - radius);
      ctx.strokeStyle = '#000';
      const ratio = window.devicePixelRatio || 1;
      ctx.lineWidth = Math.max(2, size * 0.03) / ratio;
      ctx.beginPath();
      ctx.arc(cx, cy, radius - ctx.lineWidth / 2, 0, Math.PI * 2);
      ctx.stroke();
    }

    function renderStimulus(sf, ori) {
      drawBackground();
      const diameter = Math.min(displayWidth, displayHeight) * 0.36;
      const centerX = displayWidth / 2;
      const centerY = displayHeight / 2;
      drawGabor(ctx, centerX, centerY, diameter, ori, sf);
    }

    function showFeedback(text, color) {
      feedbackOverlay.textContent = text;
      feedbackOverlay.style.color = color;
      feedbackOverlay.style.opacity = 1;
    }

    function hideFeedback() {
      feedbackOverlay.style.opacity = 0;
    }

    function updateStatus(text) {
      // Status提示已移除界面，此处仅为兼容保留。
      if (text) {
        console.log(text);
      }
    }

    function showWaitOverlay(message) {
      if (!waitOverlay) return;
      waitOverlayText.textContent = message;
      waitOverlay.classList.add('visible');
    }

    function hideWaitOverlay() {
      if (!waitOverlay) return;
      waitOverlay.classList.remove('visible');
    }

    function setExitButtonVisibility(show) {
      if (!exitButton) return;
      exitButton.style.display = show ? 'block' : 'none';
    }

    function forceResolveWaitOverlay() {
      if (typeof waitOverlayFinish === 'function') {
        waitOverlayFinish();
      }
    }

    // -------------------------
    // Response handling
    // -------------------------
    function waitForResponse() {
      return new Promise(resolve => {
        const startTime = performance.now();
        const timer = setTimeout(() => {
          if (responseState && responseState.resolve === resolve) {
            responseState = null;
          }
          resolve({ resp: 'NA', rtMs: null, timeout: true, aborted: aborted });
        }, RESP_LIMIT_MS);
        responseState = {
          resolve,
          timer,
          startTime
        };
      });
    }

    function clearResponseState() {
      if (responseState) {
        clearTimeout(responseState.timer);
        responseState = null;
      }
    }

    function deliverResponse(key) {
      if (!experimentRunning) return;
      if (!responseState) return;
      if (key !== 'a' && key !== 'b') return;
      clearTimeout(responseState.timer);
      const now = performance.now();
      const rtMs = now - responseState.startTime;
      const resolver = responseState.resolve;
      responseState = null;
      resolver({ resp: key, rtMs, timeout: false, aborted: false });
    }

    function handleKeyDown(event) {
      if (event.key === 'Escape') {
        event.preventDefault();
        if (experimentRunning && !aborted) {
          aborted = true;
          terminateExperimentEarly();
        }
        return;
      }
      if (!experimentRunning) return;
      if (!responseState) return;
      const key = event.key.toLowerCase();
      deliverResponse(key);
    }

    document.addEventListener('keydown', handleKeyDown);

    responseButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        const key = btn.getAttribute('data-key');
        deliverResponse(key);
      });
      btn.addEventListener('touchstart', (event) => {
        event.preventDefault();
        const key = btn.getAttribute('data-key');
        deliverResponse(key);
      }, { passive: false });
    });

    if (exitButton) {
      exitButton.addEventListener('click', () => {
        if (!experimentRunning) return;
        const confirmExit = confirm('确定要退出实验并导出当前数据吗？');
        if (!confirmExit) return;
        aborted = true;
        forceResolveWaitOverlay();
        terminateExperimentEarly();
      });
    }

    async function waitAnyKey(message) {
      drawBlank();
      showWaitOverlay(message);
      return new Promise(resolve => {
        let resolved = false;

        const cleanup = () => {
          document.removeEventListener('keydown', keyHandler, true);
          document.removeEventListener('pointerdown', pointerHandler, true);
          waitOverlayButton.removeEventListener('click', buttonHandler, true);
          waitOverlayButton.removeEventListener('pointerdown', buttonPointerHandler, true);
          responseButtons.forEach(btn => {
            btn.removeEventListener('pointerdown', buttonPointerHandler, true);
          });
          waitOverlayFinish = null;
        };

        const finish = () => {
          if (resolved) return;
          resolved = true;
          cleanup();
          hideWaitOverlay();
          drawBlank();
          resolve();
        };

        waitOverlayFinish = finish;

        const keyHandler = (event) => {
          const key = event.key ? event.key.toLowerCase() : '';
          if (key === 'a' || key === 'b' || key === ' ' || key === 'spacebar' || key === 'space') {
            event.preventDefault();
            finish();
          }
        };

        const pointerHandler = (event) => {
          event.preventDefault();
          finish();
        };

        const buttonPointerHandler = (event) => {
          event.preventDefault();
          finish();
        };

        const buttonHandler = (event) => {
          event.preventDefault();
          finish();
        };

        document.addEventListener('keydown', keyHandler, true);
        document.addEventListener('pointerdown', pointerHandler, true);
        waitOverlayButton.addEventListener('click', buttonHandler, true);
        waitOverlayButton.addEventListener('pointerdown', buttonPointerHandler, true);
        responseButtons.forEach(btn => {
          btn.addEventListener('pointerdown', buttonPointerHandler, true);
        });
      });
    }

    // -------------------------
    // Trial execution
    // -------------------------
    async function runBlock(task, trials, orderInSession) {
      if (!trials || trials.length === 0) return;
      currentBlockName = trials[0].blockName;
      const blockIndex = trials[0].blockIndex || 1;
      const counts = { A: 0, B: 0 };
      const sfCounts = { 3: 0, 4: 0, 5: 0, 6: 0 };
      const binCounts = { b1: 0, b2: 0, b3: 0 };
      let nearCount = 0;
      let nearA = 0, nearB = 0, farA = 0, farB = 0;
      trials.forEach(t => {
        counts[t.label] = (counts[t.label] || 0) + 1;
        sfCounts[t.sf] = (sfCounts[t.sf] || 0) + 1;
        const binKey = t.binKey || determineBinKey(t.ori);
        if (binKey) binCounts[binKey] += 1;
        if (t.nearFlag) nearCount += 1;
        if (t.nearFlag) {
          if (t.label === 'A') nearA += 1; else nearB += 1;
        } else {
          if (t.label === 'A') farA += 1; else farB += 1;
        }
      });
      const nearRatioNum = trials.length ? nearCount / trials.length : 0;
      const nearRatioStr = task === 'II' ? nearRatioNum.toFixed(3) : '';
      const qcCountsPayload = {
        counts: { ...counts },
        sfCounts: { ...sfCounts },
        binCounts: { ...binCounts },
        near: {
          ratio: Number(nearRatioNum.toFixed(3)),
          count: nearCount,
          nearA,
          nearB,
          farA,
          farB
        }
      };
      const qcCountsJson = JSON.stringify(qcCountsPayload);
      console.log(`QC ${currentBlockName}: A=${counts.A}, B=${counts.B}, sf3=${sfCounts[3]}, sf4=${sfCounts[4]}, sf5=${sfCounts[5]}, sf6=${sfCounts[6]}, bin1=${binCounts.b1}, bin2=${binCounts.b2}, bin3=${binCounts.b3}, near=${nearRatioNum.toFixed(3)}, nearA=${nearA}, nearB=${nearB}, farA=${farA}, farB=${farB}`);
      for (let i = 0; i < trials.length; i++) {
        if (aborted) break;
        const trial = trials[i];
        const trialStartUTC = new Date().toISOString();
        if (USE_FIXATION) {
          drawFixation();
          await wait(FIX_MS);
          if (aborted) break;
        }
        if (USE_PREBLANK) {
          drawBlank();
          await wait(PREBLANK_MS);
          if (aborted) break;
        }
        renderStimulus(trial.sf, trial.ori);
        const response = await waitForResponse();
        clearResponseState();
        drawBlank();
        if (participantMeta.delayMs > 0) {
          drawFixation();
          await wait(participantMeta.delayMs);
          if (aborted) break;
          drawBlank();
        }
        if (response.aborted || aborted) {
          break;
        }
        let rtSec = '';
        let respKey = response.resp;
        if (!response.timeout && response.rtMs != null) {
          rtSec = (response.rtMs / 1000).toFixed(3);
        }
        if (response.timeout) {
          respKey = 'NA';
        }
        const corr = respKey === trial.correctKey ? 1 : 0;
        showFeedback(corr ? 'Right' : 'Wrong', corr ? '#2ecc71' : '#e74c3c');
        await wait(FEEDBACK_MS);
        hideFeedback();
        if (aborted) break;
        dataRows.push([
          participantId,
          participantMeta.group,
          participantMeta.orderCode,
          participantMeta.serial,
          participantMeta.sessionIndex,
          participantMeta.movement,
          task,
          orderInSession,
          trial.blockName,
          blockIndex,
          trial.trialIndex,
          trial.sf,
          trial.ori.toFixed(3),
          trial.nearFlag,
          trial.label,
          trial.correctKey,
          respKey,
          corr,
          rtSec,
          participantMeta.delayMs,
          trialStartUTC,
          nearRatioStr,
          qcCountsJson
        ]);
      }
    }

    // -------------------------
    // Experiment control
    // -------------------------
    async function startExperiment() {
      experimentRunning = true;
      aborted = false;
      setExitButtonVisibility(true);
      dataRows = [];
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);
      const rbBlocks = makeTrialsRB_balancedV3(participantId, sessionConfig.rbRule);
      const iiBlocks = makeTrialsII_balancedV3(participantId, { wsf: sessionConfig.wsf, wori: sessionConfig.wori });
      const blockStore = { RB: rbBlocks, II: iiBlocks };
      for (let t = 0; t < participantMeta.taskOrder.length; t++) {
        const task = participantMeta.taskOrder[t];
        const blocks = blockStore[task] || [];
        for (let b = 0; b < blocks.length; b++) {
          if (aborted) break;
          await runBlock(task, blocks[b], t + 1);
        }
        if (aborted) break;
        if (t === 0 && participantMeta.taskOrder.length > 1) {
          await waitAnyKey('提示：接下来规则将发生变化，请按任意键继续。');
        }
      }
      if (!aborted) {
        concludeExperiment();
      }
    }

    function buildCSVContent(rows) {
      const allRows = [CSV_HEADER.join(',')];
      for (const row of rows) {
        const formatted = row.map(value => {
          if (value === null || value === undefined) return '';
          const str = String(value);
          if (str.includes(',') || str.includes('"') || str.includes('\n')) {
            return '"' + str.replace(/"/g, '""') + '"';
          }
          return str;
        }).join(',');
        allRows.push(formatted);
      }
      return allRows.join('\n');
    }

    function downloadCSV(filename, rows) {
      if (pendingDownload) return;
      const csvContent = buildCSVContent(rows);
      const blob = new Blob([csvContent], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement('a');
      anchor.href = url;
      anchor.download = filename;
      document.body.appendChild(anchor);
      anchor.click();
      document.body.removeChild(anchor);
      URL.revokeObjectURL(url);
      pendingDownload = true;
    }

    function concludeExperiment() {
      experimentRunning = false;
      setExitButtonVisibility(false);
      forceResolveWaitOverlay();
      hideWaitOverlay();
      updateStatus('实验完成，CSV 已自动下载。');
      const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
      const filename = `gabor_${participantId || 'anon'}_${timestamp}.csv`;
      downloadCSV(filename, dataRows);
      showCompletionMessage();
    }

    function terminateExperimentEarly() {
      if (!experimentRunning) return;
      clearResponseState();
      experimentRunning = false;
      setExitButtonVisibility(false);
      forceResolveWaitOverlay();
      hideWaitOverlay();
      updateStatus('实验已中止，CSV 已自动下载。');
      const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
      const filename = `gabor_${participantId || 'anon'}_${timestamp}.csv`;
      downloadCSV(filename, dataRows);
      showCompletionMessage();
    }

    function showCompletionMessage() {
      hideFeedback();
      drawBlank();
      ctx.fillStyle = '#fff';
      ctx.font = '28px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('感谢参与实验！', displayWidth / 2, displayHeight / 2);
    }

    function resetState() {
      aborted = false;
      pendingDownload = false;
      setExitButtonVisibility(false);
      forceResolveWaitOverlay();
      hideWaitOverlay();
    }

    async function handleStart() {
      participantId = participantInput.value.trim();
      if (!participantId) {
        alert('请输入被试编号。');
        return;
      }
      const sessionIndex = requestSessionIndex();
      if (!sessionIndex) {
        alert('请先选择本次场次（1 或 2）。');
        return;
      }
      resetState();
      participantMeta = parseIdV2(participantId, sessionIndex);
      if (!participantMeta) {
        alert('编号格式应为字母 A/B + 1~4 的编号 + 至少一位序号，例如 A11、B204。');
        return;
      }
      sessionConfig = sessionParams(participantMeta.sessionIndex);
      console.log(`ID 解析: group=${participantMeta.group}, orderCode=${participantMeta.orderCode}, serial=${participantMeta.serial}, session=${participantMeta.sessionIndex}, movement=${participantMeta.movement}, taskOrder=${participantMeta.taskOrder.join('>')}, delayMs=${participantMeta.delayMs}`);
      console.log(`II 判定公式：score = ${sessionConfig.wsf.toFixed(2)} * x + ${sessionConfig.wori.toFixed(2)} * y (bias=0, x=(sf-4.5)/1.5, y=ori/15)`);
      startScreen.style.display = 'none';
      experimentContainer.style.display = 'flex';
      updateStatus('正在尝试进入全屏模式...');
      try {
        if (document.fullscreenEnabled) {
          await document.documentElement.requestFullscreen();
        }
      } catch (err) {
        console.warn('Fullscreen request failed:', err);
      }
      await wait(100);
      updateStatus('正在准备试次，请稍候...');
      startExperiment();
    }

    startButton.addEventListener('click', handleStart);

    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement && experimentRunning && !aborted) {
        // If participant exits fullscreen manually, continue but note in status.
        updateStatus('已退出全屏，实验仍将继续。');
      }
    });

    window.addEventListener('load', () => {
      resizeCanvas();
      drawBlank();
    });
  </script>
