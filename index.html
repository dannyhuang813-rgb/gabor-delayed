<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>Gabor 分类实验</title>
  <style>
    :root {
      color-scheme: light dark;
    }
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }
    body, html {
      margin: 0;
      height: 100%;
      background: #888;
      color: #111;
    }
    #startScreen, #experimentContainer {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;
    }
    #experimentContainer {
      display: none;
    }
    #participantInput {
      padding: 10px 14px;
      font-size: 18px;
      border-radius: 6px;
      border: 1px solid #333;
      min-width: 260px;
    }
    #startButton {
      padding: 12px 24px;
      font-size: 18px;
      border-radius: 6px;
      border: none;
      background: #2c7be5;
      color: #fff;
      cursor: pointer;
    }
    #startButton:disabled {
      background: #777;
      cursor: not-allowed;
    }
    #canvasWrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: #888;
    }
    #feedbackOverlay {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: 48px;
      font-weight: bold;
      text-shadow: 0 0 10px rgba(0,0,0,0.5);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.1s ease;
    }
    #responseButtons {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 16px;
      z-index: 10;
    }
    #responseButtons button {
      padding: 14px 24px;
      font-size: 18px;
      border-radius: 999px;
      border: none;
      background: rgba(0,0,0,0.6);
      color: #fff;
      min-width: 140px;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    #responseButtons button:active {
      background: rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>
  <div id="startScreen">
    <label for="participantInput">被试编号</label>
    <input id="participantInput" type="text" autocomplete="off" />
    <button id="startButton">开始</button>
    <p style="max-width: 420px; text-align: center; line-height: 1.4; font-size: 14px; color: #222;">
      点击“开始”进入 Gabor 分类实验。作答可按键 A/B，或点击屏幕下方的 A 类、B 类按钮。随时按下 Escape 可终止并立刻下载已收集数据。
    </p>
  </div>
  <div id="experimentContainer">
    <div id="canvasWrapper">
      <canvas id="gaborCanvas"></canvas>
      <div id="feedbackOverlay"></div>
    </div>
    <div id="responseButtons">
      <button class="responseButton" data-key="a">选择 A 类（键盘 A）</button>
      <button class="responseButton" data-key="b">选择 B 类（键盘 B）</button>
    </div>
  </div>
  <script>
    // -------------------------
    // Configurable constants (do not mutate elsewhere)
    // -------------------------
    const N_RB = 200;
    const N_II = 200;

    const USE_FIXATION = true,  FIX_MS = 500;
    const USE_PREBLANK = true, PREBLANK_MS = 200;
    const RESP_LIMIT_MS = 3500;
    const FEEDBACK_MS   = 700;

    const ORI_MIN = -15, ORI_MAX = 15;
    const SF_LINES = [3, 4, 5, 6]; // We store the visible黑白成对条纹数量（cycle count）到 CSV。

    const ORI_JITTER = 0.5;

    const DEFAULT_RB_THRESHOLD = 7;
    const WEIGHT_SET_A = { W_SF: 0.65, W_ORI: 0.35 }; // 密度优先
    const WEIGHT_SET_B = { W_SF: 0.35, W_ORI: 0.65 }; // 方向优先
    const DEFAULT_W_SF = 0.65;
    const DEFAULT_W_ORI = 0.35;
    const II_BIAS_A = 0; // 新的平衡排布让 bias=0 也能确保 1:1
    const II_BIAS_B = 0;

    // 绝对角度→复制次数：每次复制会把正负两个方向都覆盖一次，并遍历 3/4/5/6 条纹。
    // 该表实现：|ori|∈[1,5] 每 bin 32 试（每条 sf 8 次）、|ori|∈[6,10] 每 bin 36 试（每条 sf 9 次）、|ori|∈[11,15] 每 bin 32 试。
    const II_MAG_REPLICATES = {
      1: 2,
      2: 2,
      3: 1,
      4: 1,
      5: 2,
      6: 2,
      7: 2,
      8: 2,
      9: 1,
      10: 2,
      11: 2,
      12: 1,
      13: 1,
      14: 2,
      15: 2
    };
    const DELAYED_STAGE_MS = 2500;

    const CSV_HEADER = ['participant','blockName','trialIndex','sf','ori','label','correctKey','resp','corr','rt','timeout','trialStartUTC'];

    // -------------------------
    // DOM references
    // -------------------------
    const startScreen = document.getElementById('startScreen');
    const experimentContainer = document.getElementById('experimentContainer');
    const startButton = document.getElementById('startButton');
    const participantInput = document.getElementById('participantInput');
    const canvas = document.getElementById('gaborCanvas');
    const ctx = canvas.getContext('2d');
    const feedbackOverlay = document.getElementById('feedbackOverlay');
    const responseButtons = document.querySelectorAll('.responseButton');

    // -------------------------
    // State variables
    // -------------------------
    let experimentRunning = false;
    let aborted = false;
    let participantId = '';
    let participantConfig = null;
    let dataRows = [];
    let responseState = null;
    let currentBlockName = '';
    let pendingDownload = false;
    let displayWidth = window.innerWidth;
    let displayHeight = window.innerHeight;

    // -------------------------
    // Utility helpers
    // -------------------------
    function resizeCanvas() {
      const ratio = window.devicePixelRatio || 1;
      displayWidth = window.innerWidth;
      displayHeight = window.innerHeight;
      canvas.width = Math.round(displayWidth * ratio);
      canvas.height = Math.round(displayHeight * ratio);
      canvas.style.width = displayWidth + 'px';
      canvas.style.height = displayHeight + 'px';
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    }

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function wait(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function hashString(str) {
      let h = 1779033703 ^ str.length;
      for (let i = 0; i < str.length; i++) {
        h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
        h = (h << 13) | (h >>> 19);
      }
      return function rng() {
        h = Math.imul(h ^ (h >>> 16), 2246822507);
        h = Math.imul(h ^ (h >>> 13), 3266489909);
        h ^= h >>> 16;
        return (h >>> 0) / 4294967296;
      };
    }

    function shuffleInPlace(array, rng) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(rng() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }

    // -------------------------
    // Participant driven configuration
    // -------------------------
    function deriveParticipantConfig(participant) {
      const trimmed = (participant || '').trim();
      let rbThreshold = DEFAULT_RB_THRESHOLD;
      let rbMode = 'ori';
      let rbStrictLt = false;
      let wSf = DEFAULT_W_SF;
      let wOri = DEFAULT_W_ORI;
      let delayMs = 0;
      let iiBias = 0;

      const matchLetter = trimmed.match(/[a-zA-Z]/);
      const matchDigit = trimmed.match(/\d/);
      if (matchLetter) {
        const letter = matchLetter[0].toUpperCase();
        if (letter === 'A') {
          rbThreshold = 7;
          rbStrictLt = true;
          wSf = WEIGHT_SET_A.W_SF;
          wOri = WEIGHT_SET_A.W_ORI;
          iiBias = II_BIAS_A;
        } else if (letter === 'B') {
          rbMode = 'sf';
          rbThreshold = DEFAULT_RB_THRESHOLD;
          wSf = WEIGHT_SET_B.W_SF;
          wOri = WEIGHT_SET_B.W_ORI;
          iiBias = II_BIAS_B;
        }
      }
      if (matchDigit) {
        const digit = matchDigit[0];
        if (digit === '2') {
          delayMs = DELAYED_STAGE_MS;
        } else if (digit === '1') {
          delayMs = 0;
        }
      }

      return {
        RB_ABS_ORI_THRESHOLD: rbThreshold,
        RB_MODE: rbMode,
        RB_STRICT_LT: rbStrictLt,
        W_SF: wSf,
        W_ORI: wOri,
        II_BIAS: iiBias,
        delayMs
      };
    }

    // -------------------------
    // Labeling functions
    // -------------------------
    function labelRB(oriDeg, sfLines, cfg) {
      if (cfg.RB_MODE === 'sf') {
        return sfLines >= 5 ? 'A' : 'B';
      }
      const threshold = cfg.RB_ABS_ORI_THRESHOLD;
      if (cfg.RB_STRICT_LT) {
        return Math.abs(oriDeg) < threshold ? 'A' : 'B';
      }
      return Math.abs(oriDeg) <= threshold ? 'A' : 'B';
    }

    function computeIIScore(sfLines, oriDeg, cfg) {
      const x = (sfLines - 4.5) / 1.5;
      const y = oriDeg / 15;
      const raw = cfg.W_SF * x + cfg.W_ORI * y;
      const bias = cfg.II_BIAS || 0;
      return { x, y, raw, adjusted: raw - bias };
    }

    function labelII(sfLines, oriDeg, cfg) {
      return computeIIScore(sfLines, oriDeg, cfg).adjusted > 0 ? 'A' : 'B';
    }

    // -------------------------
    // Stimulus generation helpers
    // -------------------------
    function buildSfSchedule(total, seed) {
      const perLevel = Math.floor(total / SF_LINES.length);
      let remainder = total - perLevel * SF_LINES.length;
      const schedule = [];
      for (const sf of SF_LINES) {
        const count = perLevel + (remainder > 0 ? 1 : 0);
        if (remainder > 0) remainder--;
        for (let i = 0; i < count; i++) {
          schedule.push(sf);
        }
      }
      shuffleInPlace(schedule, hashString(`${seed}_sfSchedule`));
      return schedule;
    }

    function buildSfScheduleForSet(total, allowedSfs, seed) {
      const perLevel = Math.floor(total / allowedSfs.length);
      let remainder = total - perLevel * allowedSfs.length;
      const schedule = [];
      for (const sf of allowedSfs) {
        const count = perLevel + (remainder > 0 ? 1 : 0);
        if (remainder > 0) remainder--;
        for (let i = 0; i < count; i++) {
          schedule.push(sf);
        }
      }
      shuffleInPlace(schedule, hashString(`${seed}_subsetSf`));
      return schedule;
    }

    function buildSymmetricOrientationList(minMag, maxMag, includeZero, total, seed) {
      const cycle = [];
      if (includeZero && minMag === 0) {
        cycle.push(0);
      }
      const startMag = Math.max(1, minMag);
      if (startMag > maxMag && !(includeZero && minMag === 0)) {
        return [];
      }
      for (let mag = startMag; mag <= maxMag; mag++) {
        cycle.push(-mag, mag);
      }
      if (cycle.length === 0) {
        return [];
      }
      const result = [];
      const baseCycles = Math.floor(total / cycle.length);
      for (let i = 0; i < baseCycles; i++) {
        const copy = [...cycle];
        shuffleInPlace(copy, hashString(`${seed}_cycle_${i}`));
        result.push(...copy);
      }
      let remaining = total - baseCycles * cycle.length;
      if (includeZero && minMag === 0 && remaining > 0) {
        result.push(0);
        remaining -= 1;
      }
      if (includeZero && minMag === 0 && remaining % 2 === 1) {
        result.push(0);
        remaining -= 1;
      }
      let mag = startMag;
      while (remaining > 0) {
        if (mag > maxMag) {
          mag = startMag;
        }
        if (remaining >= 2) {
          result.push(-mag, mag);
          remaining -= 2;
          mag += 1;
        } else {
          break;
        }
      }
      return result.slice(0, total);
    }

    function jitterOrientationForRB(baseOri, sf, intendedLabel, cfg, rng) {
      if (cfg.RB_MODE === 'sf') {
        const jitter = (rng() * 2 - 1) * ORI_JITTER;
        return clamp(baseOri + jitter, ORI_MIN, ORI_MAX);
      }
      const threshold = cfg.RB_ABS_ORI_THRESHOLD;
      let attempt = 0;
      while (attempt < 8) {
        const jitter = (rng() * 2 - 1) * ORI_JITTER;
        const candidate = clamp(baseOri + jitter, ORI_MIN, ORI_MAX);
        if (labelRB(candidate, sf, cfg) === intendedLabel) {
          return candidate;
        }
        attempt++;
      }
      const sign = baseOri === 0 ? 1 : Math.sign(baseOri || 1);
      if (intendedLabel === 'A') {
        const boundary = cfg.RB_STRICT_LT ? threshold : threshold + 0.0001;
        const safeLimit = Math.max(0, boundary - 0.05);
        const safeMag = Math.min(safeLimit, Math.abs(baseOri));
        return clamp(sign * safeMag, ORI_MIN, ORI_MAX);
      }
      const lower = cfg.RB_STRICT_LT ? threshold : threshold + 0.0001;
      const safeMag = Math.max(lower + 0.05, Math.abs(baseOri));
      return clamp(sign * safeMag, ORI_MIN, ORI_MAX);
    }

    function makeTrialsRB(cfg) {
      const targetPerClass = N_RB / 2;
      const orderRng = hashString(`${participantId}_RB_order`);
      const jitterRng = hashString(`${participantId}_RB_jitter`);

      if (cfg.RB_MODE === 'sf') {
        const orientA = buildSymmetricOrientationList(0, ORI_MAX, true, targetPerClass, `${participantId}_RB_A_sfOri`);
        const orientB = buildSymmetricOrientationList(0, ORI_MAX, true, targetPerClass, `${participantId}_RB_B_sfOri`);
        const sfA = buildSfScheduleForSet(targetPerClass, [5, 6], `${participantId}_RB_A_sf`);
        const sfB = buildSfScheduleForSet(targetPerClass, [3, 4], `${participantId}_RB_B_sf`);
        const entries = [
          ...orientA.map((ori, idx) => ({ baseOri: ori, intendedLabel: 'A', sf: sfA[idx] })),
          ...orientB.map((ori, idx) => ({ baseOri: ori, intendedLabel: 'B', sf: sfB[idx] }))
        ];
        shuffleInPlace(entries, orderRng);
        return entries.map((entry, idx) => {
          const ori = jitterOrientationForRB(entry.baseOri, entry.sf, entry.intendedLabel, cfg, jitterRng);
          const label = labelRB(ori, entry.sf, cfg);
          return {
            blockName: 'RB',
            trialIndex: idx + 1,
            sf: entry.sf,
            ori,
            label,
            correctKey: label === 'A' ? 'a' : 'b'
          };
        });
      }

      const threshold = cfg.RB_ABS_ORI_THRESHOLD;
      const strict = cfg.RB_STRICT_LT;
      const aMaxMag = Math.min(ORI_MAX, strict ? Math.ceil(threshold) - 1 : Math.floor(threshold));
      const bMinMag = Math.max(0, strict ? Math.ceil(threshold) : Math.floor(threshold) + 1);
      const aOrientations = aMaxMag >= 0
        ? buildSymmetricOrientationList(0, aMaxMag, true, targetPerClass, `${participantId}_RB_A`)
        : [];
      const bOrientations = bMinMag <= ORI_MAX
        ? buildSymmetricOrientationList(Math.max(1, bMinMag), ORI_MAX, false, targetPerClass, `${participantId}_RB_B`)
        : [];
      const entries = [
        ...aOrientations.map(ori => ({ baseOri: ori, intendedLabel: 'A' })),
        ...bOrientations.map(ori => ({ baseOri: ori, intendedLabel: 'B' }))
      ];
      shuffleInPlace(entries, orderRng);
      const sfSchedule = buildSfSchedule(entries.length, `${participantId}_RB`);
      return entries.map((entry, idx) => {
        const sf = sfSchedule[idx];
        const ori = jitterOrientationForRB(entry.baseOri, sf, entry.intendedLabel, cfg, jitterRng);
        const label = labelRB(ori, sf, cfg);
        return {
          blockName: 'RB',
          trialIndex: idx + 1,
          sf,
          ori,
          label,
          correctKey: label === 'A' ? 'a' : 'b'
        };
      });
    }

    function jitterOrientationForII(baseOri, sf, intendedLabel, cfg, rng) {
      for (let attempt = 0; attempt < 8; attempt++) {
        const jitter = (rng() * 2 - 1) * ORI_JITTER;
        const candidate = clamp(baseOri + jitter, ORI_MIN, ORI_MAX);
        if (labelII(sf, candidate, cfg) === intendedLabel) {
          return candidate;
        }
      }
      if (labelII(sf, baseOri, cfg) === intendedLabel) {
        return baseOri;
      }
      return clamp(baseOri, ORI_MIN, ORI_MAX);
    }

    function buildIIPool() {
      const pool = [];
      Object.entries(II_MAG_REPLICATES).forEach(([magStr, repeats]) => {
        const mag = Number(magStr);
        const reps = Number(repeats) || 0;
        if (!reps) return;
        for (const sign of [-1, 1]) {
          const baseOri = sign * mag;
          for (let r = 0; r < reps; r++) {
            SF_LINES.forEach(sf => {
              pool.push({ baseOri, sf });
            });
          }
        }
      });
      return pool;
    }

    function makeTrialsII(cfg) {
      const basePool = buildIIPool();
      const jitterRng = hashString(`${participantId}_II_jitter`);
      const orderRng = hashString(`${participantId}_II_order`);
      const trials = basePool.map(item => {
        const intendedLabel = labelII(item.sf, item.baseOri, cfg);
        const ori = jitterOrientationForII(item.baseOri, item.sf, intendedLabel, cfg, jitterRng);
        return {
          blockName: 'II',
          sf: item.sf,
          ori,
          label: intendedLabel,
          correctKey: intendedLabel === 'A' ? 'a' : 'b'
        };
      });
      shuffleInPlace(trials, orderRng);
      return trials.map((trial, idx) => ({ ...trial, trialIndex: idx + 1 }));
    }
    // -------------------------
    // Stimulus rendering
    // -------------------------
    function drawBackground() {
      ctx.fillStyle = '#888';
      ctx.fillRect(0, 0, displayWidth, displayHeight);
    }

    function drawFixation() {
      drawBackground();
      const centerX = displayWidth / 2;
      const centerY = displayHeight / 2;
      ctx.strokeStyle = '#111';
      const ratio = window.devicePixelRatio || 1;
      ctx.lineWidth = 4 / ratio;
      const size = Math.min(displayWidth, displayHeight) * 0.02;
      ctx.beginPath();
      ctx.moveTo(centerX - size, centerY);
      ctx.lineTo(centerX + size, centerY);
      ctx.moveTo(centerX, centerY - size);
      ctx.lineTo(centerX, centerY + size);
      ctx.stroke();
    }

    function drawBlank() {
      drawBackground();
    }

    function drawGabor(ctx, cx, cy, diameterPx, oriDeg, sfPairs) {
      const size = Math.max(8, Math.round(diameterPx));
      const offCanvas = document.createElement('canvas');
      offCanvas.width = size;
      offCanvas.height = size;
      const offCtx = offCanvas.getContext('2d');
      const imageData = offCtx.createImageData(size, size);
      const data = imageData.data;
      const radius = size / 2;
      const orientation = oriDeg * Math.PI / 180;
      // 条纹换算：sfPairs 表示黑白为一组的可见条纹数量（cycle 数），freq=cycle/D 确保直径方向出现指定组数。
      const cycles = sfPairs;
      const freq = cycles / size;
      const cosOri = Math.cos(orientation);
      const sinOri = Math.sin(orientation);
      const sigma = radius * 0.45;
      const twoSigmaSq = 2 * sigma * sigma;
      const base = 128;
      const amplitude = 110;
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const dx = x - radius + 0.5;
          const dy = y - radius + 0.5;
          const distSq = dx * dx + dy * dy;
          const idx = (y * size + x) * 4;
          if (distSq > radius * radius) {
            data[idx] = 136;
            data[idx + 1] = 136;
            data[idx + 2] = 136;
            data[idx + 3] = 255;
            continue;
          }
          const rotX = dx * cosOri + dy * sinOri;
          const sine = Math.cos(2 * Math.PI * freq * rotX);
          const gaussian = Math.exp(-distSq / twoSigmaSq);
          const value = clamp(Math.round(base + gaussian * amplitude * sine), 0, 255);
          data[idx] = value;
          data[idx + 1] = value;
          data[idx + 2] = value;
          data[idx + 3] = 255;
        }
      }
      offCtx.putImageData(imageData, 0, 0);
      ctx.drawImage(offCanvas, cx - radius, cy - radius);
      ctx.strokeStyle = '#000';
      const ratio = window.devicePixelRatio || 1;
      ctx.lineWidth = Math.max(2, size * 0.03) / ratio;
      ctx.beginPath();
      ctx.arc(cx, cy, radius - ctx.lineWidth / 2, 0, Math.PI * 2);
      ctx.stroke();
    }

    function renderStimulus(sf, ori) {
      drawBackground();
      const diameter = Math.min(displayWidth, displayHeight) * 0.36;
      const centerX = displayWidth / 2;
      const centerY = displayHeight / 2;
      drawGabor(ctx, centerX, centerY, diameter, ori, sf);
    }

    function showFeedback(text, color) {
      feedbackOverlay.textContent = text;
      feedbackOverlay.style.color = color;
      feedbackOverlay.style.opacity = 1;
    }

    function hideFeedback() {
      feedbackOverlay.style.opacity = 0;
    }

    function updateStatus(text) {
      // Status提示已移除界面，此处仅为兼容保留。
      if (text) {
        console.log(text);
      }
    }

    // -------------------------
    // Response handling
    // -------------------------
    function waitForResponse() {
      return new Promise(resolve => {
        const startTime = performance.now();
        const timer = setTimeout(() => {
          if (responseState && responseState.resolve === resolve) {
            responseState = null;
          }
          resolve({ resp: 'NA', rtMs: null, timeout: true, aborted: aborted });
        }, RESP_LIMIT_MS);
        responseState = {
          resolve,
          timer,
          startTime
        };
      });
    }

    function clearResponseState() {
      if (responseState) {
        clearTimeout(responseState.timer);
        responseState = null;
      }
    }

    function deliverResponse(key) {
      if (!experimentRunning) return;
      if (!responseState) return;
      if (key !== 'a' && key !== 'b') return;
      clearTimeout(responseState.timer);
      const now = performance.now();
      const rtMs = now - responseState.startTime;
      const resolver = responseState.resolve;
      responseState = null;
      resolver({ resp: key, rtMs, timeout: false, aborted: false });
    }

    function handleKeyDown(event) {
      if (event.key === 'Escape') {
        event.preventDefault();
        if (experimentRunning && !aborted) {
          aborted = true;
          terminateExperimentEarly();
        }
        return;
      }
      if (!experimentRunning) return;
      if (!responseState) return;
      const key = event.key.toLowerCase();
      deliverResponse(key);
    }

    document.addEventListener('keydown', handleKeyDown);

    responseButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        const key = btn.getAttribute('data-key');
        deliverResponse(key);
      });
      btn.addEventListener('touchstart', (event) => {
        event.preventDefault();
        const key = btn.getAttribute('data-key');
        deliverResponse(key);
      }, { passive: false });
    });

    // -------------------------
    // Trial execution
    // -------------------------
    async function runBlock(blockName, trials) {
      currentBlockName = blockName;
      updateStatus('请尽快判断后选择 A 类或 B 类。');
      for (let i = 0; i < trials.length; i++) {
        if (aborted) break;
        const trial = trials[i];
        const trialStartUTC = new Date().toISOString();
        if (USE_FIXATION) {
          drawFixation();
          await wait(FIX_MS);
          if (aborted) break;
        }
        if (USE_PREBLANK) {
          drawBlank();
          await wait(PREBLANK_MS);
          if (aborted) break;
        }
        renderStimulus(trial.sf, trial.ori);
        const response = await waitForResponse();
        clearResponseState();
        drawBlank();
        if (participantConfig.delayMs > 0) {
          drawFixation();
          await wait(participantConfig.delayMs);
          if (aborted) break;
          drawBlank();
        }
        if (response.aborted || aborted) {
          break;
        }
        let rtSec = '';
        let respKey = response.resp;
        let timeoutFlag = response.timeout ? 1 : 0;
        if (!response.timeout && response.rtMs != null) {
          rtSec = (response.rtMs / 1000).toFixed(3);
        }
        if (response.timeout) {
          respKey = 'NA';
        }
        const corr = respKey === trial.correctKey ? 1 : 0;
        showFeedback(corr ? 'Right' : 'Wrong', corr ? '#2ecc71' : '#e74c3c');
        await wait(FEEDBACK_MS);
        hideFeedback();
        if (aborted) break;
        dataRows.push([
          participantId,
          trial.blockName,
          trial.trialIndex,
          trial.sf,
          trial.ori.toFixed(3),
          trial.label,
          trial.correctKey,
          respKey,
          corr,
          rtSec,
          timeoutFlag,
          trialStartUTC
        ]);
      }
    }

    // -------------------------
    // Experiment control
    // -------------------------
    async function startExperiment() {
      experimentRunning = true;
      aborted = false;
      dataRows = [];
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);
      const rbTrials = makeTrialsRB(participantConfig);
      const iiTrials = makeTrialsII(participantConfig);
      await runBlock('RB', rbTrials);
      if (!aborted) {
        await runBlock('II', iiTrials);
      }
      if (!aborted) {
        concludeExperiment();
      }
    }

    function buildCSVContent(rows) {
      const allRows = [CSV_HEADER.join(',')];
      for (const row of rows) {
        const formatted = row.map(value => {
          if (value === null || value === undefined) return '';
          const str = String(value);
          if (str.includes(',') || str.includes('"') || str.includes('\n')) {
            return '"' + str.replace(/"/g, '""') + '"';
          }
          return str;
        }).join(',');
        allRows.push(formatted);
      }
      return allRows.join('\n');
    }

    function downloadCSV(filename, rows) {
      if (pendingDownload) return;
      const csvContent = buildCSVContent(rows);
      const blob = new Blob([csvContent], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement('a');
      anchor.href = url;
      anchor.download = filename;
      document.body.appendChild(anchor);
      anchor.click();
      document.body.removeChild(anchor);
      URL.revokeObjectURL(url);
      pendingDownload = true;
    }

    function concludeExperiment() {
      experimentRunning = false;
      updateStatus('实验完成，CSV 已自动下载。');
      const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
      const filename = `gabor_${participantId || 'anon'}_${timestamp}.csv`;
      downloadCSV(filename, dataRows);
      showCompletionMessage();
    }

    function terminateExperimentEarly() {
      if (!experimentRunning) return;
      clearResponseState();
      experimentRunning = false;
      updateStatus('实验已中止，CSV 已自动下载。');
      const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
      const filename = `gabor_${participantId || 'anon'}_${timestamp}.csv`;
      downloadCSV(filename, dataRows);
      showCompletionMessage();
    }

    function showCompletionMessage() {
      hideFeedback();
      drawBlank();
      ctx.fillStyle = '#fff';
      ctx.font = '28px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('感谢参与实验！', displayWidth / 2, displayHeight / 2);
    }

    function resetState() {
      aborted = false;
      pendingDownload = false;
    }

    async function handleStart() {
      participantId = participantInput.value.trim();
      if (!participantId) {
        alert('请输入被试编号。');
        return;
      }
      resetState();
      participantConfig = deriveParticipantConfig(participantId);
      console.log(`II 判定公式：score = ${participantConfig.W_SF.toFixed(2)} * x + ${participantConfig.W_ORI.toFixed(2)} * y - ${participantConfig.II_BIAS.toFixed(4)} (x=(sf-4.5)/1.5, y=ori/15)`);
      startScreen.style.display = 'none';
      experimentContainer.style.display = 'flex';
      updateStatus('正在尝试进入全屏模式...');
      try {
        if (document.fullscreenEnabled) {
          await document.documentElement.requestFullscreen();
        }
      } catch (err) {
        console.warn('Fullscreen request failed:', err);
      }
      await wait(100);
      updateStatus('正在准备试次，请稍候...');
      startExperiment();
    }

    startButton.addEventListener('click', handleStart);

    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement && experimentRunning && !aborted) {
        // If participant exits fullscreen manually, continue but note in status.
        updateStatus('已退出全屏，实验仍将继续。');
      }
    });

    window.addEventListener('load', () => {
      resizeCanvas();
      drawBlank();
    });
  </script>
</body>
